<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quest</title>
  <!-- PeerJS Library CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overflow: hidden;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #c4abb0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 10;
      display: none; /* hidden until menu choice is made */
      flex-wrap: wrap;
      gap: 4px;
      background: none;
      padding: 0;
      border: none;
      color: #fff;
    }
    button, select, label, input[type="text"] {
      font-size: 11px;
      padding: 2px 6px;
      border: none;
      border-radius: 0px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      outline: none;
    }
    input[type="text"] {
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
      width: 110px;
    }
    button:hover {
      background: rgba(0, 0, 0, 0.6);
    }
    button.active {
      background: rgba(57, 173, 88, 0.8);
    }
    #addBtn.active {
      background: rgba(43, 123, 185, 0.8);
    }
    #fileInput {
      display: none;
    }

    /* --- Main menu --- */
    #mainMenu {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #6487d9;
      color: #fff;
      text-align: center;
    }
    #mainMenu.hidden { display: none; }
    #mainMenu h1 {
      font-size: 100px;
      margin-bottom: 60px;
    }
    #mainMenu .menu-panel {
      background: rgba(68, 58, 58, 0.4);
      padding: 20px 28px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 280px;
      align-items: stretch;
    }
    #mainMenu .menu-label {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    #mainMenu .menu-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #mainMenu input[type="text"] {
      font-size: 14px;
      text-align: center;
      font-size: 34px;
      width: 220px;
      height: 60px;
      border-radius: 999px;
      background: transparent;
    }
    #mainMenu button.menu-btn {
      font-size: 34px;
      padding: 10px 18px;
      border-radius: 999px;
      width: 380px;
      background: rgba(0, 0, 0, 0.6);
    }
    #mainMenu button.menu-btn:hover { background: rgba(57, 173, 88, 1); color: #fff; }
    #mainMenu .menu-status {
      min-height: 18px;
      font-size: 13px;
      opacity: 0.8;
    }
    #mainMenu .menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
      margin: 4px 0;
    }
    #mainMenu .menu-hint {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 6px;
      max-width: 280px;
      line-height: 1.4;
    }

    /* Merged Join Input Container */
    .join-container {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 999px;
      width: 380px;
      height: 60px;
    }
    .join-container input[type="text"] {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      border-radius: 999px 0 0 999px;
      width: 160px !important;
      padding-right: 0px !important;
      transform: translateX(10px);
      font-size: 28px;
      text-align: center;
      color: #fff;
      padding: 0 10px;
    }
    .join-container button.menu-btn {
      height: 100%;
      width: auto;
      padding: 0 24px;
      font-size: 24px;
      background: transparent !important;
      border-radius: 999px;
      white-space: nowrap;
    }
    .join-container button.menu-btn:hover {
      background: rgba(57, 173, 88, 1) !important;
      color: #fff;
    }

    #shapeProps {
      position: absolute;
      z-index: 12;
      display: none;
      flex-direction: column;
      gap: 3px;
      padding: 5px 7px;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 11px;
      white-space: nowrap;
    }
    #shapeProps .spHead {
      font-weight: 600;
      opacity: 0.7;
    }
    #shapeProps .spRow {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 1px 0;
      background: none;
      cursor: default;
    }
    #shapeProps input[type="checkbox"] {
      width: 12px;
      height: 12px;
      margin: 0;
      accent-color: #39ad58;
      cursor: pointer;
    }
    #shapeProps input[type="number"] {
      font-size: 11px;
      padding: 1px 3px;
      border: none;
      border-radius: 0;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      outline: none;
      width: 44px;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }
    #shapeProps .spDim {
      opacity: 0.35;
    }
  </style>
</head>
<body>

  <!-- Main Menu -->
  <div id="mainMenu">
    <h1>Quest</h1>

    <button class="menu-btn" id="menuHostBtn">Host World</button>
    
    <div class="join-container">
      <input type="text" id="menuPeerIdInput" placeholder="ID" maxlength="6">
      <button class="menu-btn" id="menuJoinBtn">Join World</button>
    </div>
    
    <div class="menu-status" id="menuStatus" style="display: none;"></div>
  </div>

  <div id="ui">
    <button id="modeBtn" tabindex="-1">Switch to Editor Mode</button>
    <div id="editorControls" style="display: none; gap: 4px; align-items: center;">
      <button id="addBtn" tabindex="-1">+ Add Block</button>
      <label>Type:
        <select id="rectType" tabindex="-1">
          <option value="grass">Grass</option>
          <option value="platform">Platform</option>
          <option value="obstacle">Obstacle</option>
        </select>
      </label>
      <button id="saveLocalBtn" tabindex="-1">Save Local</button>
      <button id="loadLocalBtn" tabindex="-1">Load Local</button>
      <button id="exportBtn" tabindex="-1">Export JSON</button>
      <button id="importBtn" tabindex="-1">Import JSON</button>
      <button id="clearBtn" tabindex="-1">Clear All</button>
      <input type="file" id="fileInput" accept=".json" tabindex="-1">
    </div>

    <!-- PeerJS Connection UI -->
    <div id="rtcControls" style="display: flex; gap: 4px; align-items: center;">
      <button id="hostBtn" tabindex="-1">Host</button>
      <input type="text" id="peerIdInput" placeholder="Enter Host ID..." tabindex="-1">
      <button id="joinBtn" tabindex="-1">Join</button>
    </div>
  </div>

  <div id="shapeProps">
    <span class="spHead">Shape Properties</span>
    <label class="spRow"><input type="checkbox" id="spDeadly"> Deadly</label>
    <label class="spRow"><input type="checkbox" id="spSpin"> Spins</label>
    <label class="spRow spSpinOpt">Speed
      <input type="number" id="spSpinSpeed" min="1" max="720" step="5" value="45"> &deg;/s
    </label>
    <label class="spRow spSpinOpt">Direction
      <select id="spSpinDir">
        <option value="1">Clockwise</option>
        <option value="-1">Counter-clockwise</option>
      </select>
    </label>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const PALETTE = {
        sky: '#6487d9',
        ground: '#39ad58',
        dirt: '#523a28',
        block: '#8a2b2b',
        platform: '#723838',
        platformShadow: 'rgba(0, 0, 0, 0.2)',
        bolt: '#4a4a4a',
        player: '#ffffff'
    };

    const CAMERA_ZOOM = 1.5;
    const NODE_SPACING = 24;
    const GRID_SIZE = 24;

    let isEditor = false;
    let isPlacementMode = false;
    let width = window.innerWidth;
    let height = window.innerHeight;
    
    let groundY = Math.floor(((height / CAMERA_ZOOM) * 0.75) / GRID_SIZE) * GRID_SIZE;

    let cameraX = 0;
    let cameraY = 0;
    // Camera drawn this frame, blended between the last two physics steps.
    let renderCameraX = 0;
    let renderCameraY = 0;
    let prevCameraX = 0;
    let prevCameraY = 0;
    let editorCamX = 0;
    let editorCamY = 0;
    let editorZoom = 1.0;

    function getDefaultRectangles() {
      return [
        { x: -504, y: groundY, w: 2016, h: 408, type: 'grass' },
        { x: 288, y: groundY - 144, w: 192, h: 48, type: 'platform' },
        { x: 648, y: groundY - 72, w: 72, h: 72, type: 'obstacle' }
      ];
    }

    let rectangles = [];

    // Every rect carries a stable id so peers can talk about one shape instead of
    // one array position. Syncing by index meant two people editing different
    // shapes overwrote each other, and any reorder or delete silently moved
    // everyone's selection onto a different rect. The random prefix keeps ids
    // unique when two peers add a shape at the same moment.
    const RECT_ID_PREFIX = Math.random().toString(36).slice(2, 8);
    let nextRectId = 1;

    function newRectId() {
      return RECT_ID_PREFIX + '-' + (nextRectId++).toString(36);
    }

    function ensureRectId(rect) {
      if (rect && !rect.id) rect.id = newRectId();
      return rect;
    }

    function ensureRectIds(list) {
      if (Array.isArray(list)) list.forEach(ensureRectId);
      return list;
    }

    // The fields that make up a rect's identity for sync purposes. Ids are added
    // on load; the geometry is what peers merge.
    function rectPayload(rect) {
      return {
        id: rect.id,
        x: rect.x,
        y: rect.y,
        w: rect.w,
        h: rect.h,
        type: rect.type,
        // The base angle, never getRectRotation(): sending the live spun angle
        // would make every spinning shape look edited on all 20 syncs a second,
        // and peers would add their own phase on top of it.
        rotation: rect.rotation || 0,
        spin: rect.spin || 0,
        deadly: isDeadly(rect)
      };
    }

    function applyRectPayload(rect, payload) {
      rect.x = payload.x;
      rect.y = payload.y;
      rect.w = payload.w;
      rect.h = payload.h;
      rect.type = payload.type;
      rect.rotation = payload.rotation || 0;
      rect.spin = payload.spin || 0;
      rect.deadly = payload.deadly === undefined ? payload.type === 'obstacle' : !!payload.deadly;
      return rect;
    }

    async function loadDefaultLevel() {
      try {
        const response = await fetch('level.json');
        if (response.ok) {
          const levelData = await response.json();
          adoptLocalLevel(levelData);
          return;
        }
      } catch (err) {
        console.log('Could not load level.json, trying localStorage');
      }

      const savedLevel = localStorage.getItem('custom_runner_level');
      if (savedLevel) {
        try {
          adoptLocalLevel(JSON.parse(savedLevel));
        } catch (err) {
          adoptLocalLevel(getDefaultRectangles());
        }
      } else {
        adoptLocalLevel(getDefaultRectangles());
      }
    }

    let grassBladesMap = new Map();
    let grassRunsByRect = new Map();
    let minNodeIdx = Infinity;
    let maxNodeIdx = -Infinity;
    let time = 0;

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playJumpSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    function playCrashSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    const player = {
      x: 0,
      y: 0,
      // State either side of the last physics step, blended by the leftover
      // accumulator so drawing is smooth above the 60Hz simulation rate.
      prevX: 0,
      prevY: 0,
      renderX: 0,
      renderY: 0,
      vx: 0,
      vy: 0,
      maxSpeed: 4.2,
      accel: 0.24,
      decel: 0.18,
      gravity: 0.15,
      jumpForce: -6.2,
      isGrounded: false,
      animPhase: 0,
      isAlive: true,
      facing: 1,
      leg1: { x: 0, y: 0 },
      leg2: { x: 0, y: 0 },
      isCrouching: false,
      crouchFactor: 0,
      rotation: 0 // Rotation angle in radians
    };

    // The surface the feet were placed on last step, so walking down a slope can
    // follow that same surface instead of dropping onto it.
    let playerGroundRect = null;

    // --- PeerJS Networking Integration ---
    // Star topology: the host owns the room, hands out a colour slot to every
    // peer and relays each peer's messages to the other peers, so all clients
    // see all players. Peers never talk to each other directly.
    const MAX_PLAYERS = 4;
    const PLAYER_COLORS = [
      { hex: '#ffffff', name: 'White' },
      { hex: '#e74c3c', name: 'Red' },
      { hex: '#055c96', name: 'Blue' },
      { hex: '#f1c40f', name: 'Yellow' }
    ];
    const STATE_SEND_INTERVAL = 33; // ms between player state snapshots (~30Hz)
    const LEVEL_SYNC_INTERVAL = 50; // ms between level snapshots while dragging
    const REMOTE_INTERP_DELAY = 100; // ms remote players are drawn behind by
    const REMOTE_BUFFER_LIMIT = 24; // ~0.8s of snapshots at the send rate

    let peer = null;
    let pendingPeer = null; // instance still negotiating its room code
    let netRole = null; // 'host' | 'guest'
    let isHost = false;
    let localPeerId = null;
    let localSlot = 0;
    let pendingJoinId = null;
    let roster = [];
    const connections = new Map(); // peerId -> { conn, slot, stale }
    const remotePlayers = new Map(); // peerId -> remote state

    function colorIndex(slot) {
      if (!Number.isInteger(slot)) return 0;
      return ((slot % MAX_PLAYERS) + MAX_PLAYERS) % MAX_PLAYERS;
    }

    function getPlayerColor(slot) {
      return PLAYER_COLORS[colorIndex(slot)].hex;
    }

    function applyLocalColor() {
      player.color = getPlayerColor(localSlot);
    }

    function createPeer() {
      const pin = Math.floor(100000 + Math.random() * 900000).toString();
      const p = new Peer(pin, {
        config: {
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        }
      });
      pendingPeer = p;

      p.on('open', (id) => {
        peer = p;
        pendingPeer = null;
        localPeerId = id;

        if (netRole === 'guest' && pendingJoinId) {
          const hostId = pendingJoinId;
          pendingJoinId = null;
          connectToHost(hostId);
        } else {
          becomeHost();
        }
      });

      p.on('connection', (conn) => {
        conn.on('open', () => acceptPeer(conn));
      });

      p.on('disconnected', () => {
        console.warn('Lost signalling server, retrying...');
        try { p.reconnect(); } catch (e) {}
      });

      p.on('error', (err) => {
        // A taken PIN just means a colliding room code was drawn: try again.
        if (err.type === 'unavailable-id' && !isHost) {
          pendingPeer = null;
          createPeer();
          return;
        }
        if (err.type === 'peer-unavailable') {
          setMenuStatus('No world with that ID');
          showMainMenu();
          return;
        }
        if (err.type === 'network') {
          setMenuStatus('Network error, check your connection');
          return;
        }
        setMenuStatus(`Network error: ${err.type || err.message}`);
      });

      return p;
    }

    function ensurePeer() {
      if (peer && !peer.destroyed) return peer;
      if (pendingPeer) return pendingPeer;
      return createPeer();
    }

    function becomeHost() {
      isHost = true;
      localSlot = 0;
      applyLocalColor();
      applyRoster([{ id: localPeerId, slot: 0 }]);
      peerIdInput.value = localPeerId;
      if (navigator.clipboard) navigator.clipboard.writeText(localPeerId).catch(() => {});

      // If we got here from the main menu, finalize entering the game.
      if (!gameEntered) enterGame();
    }

    // Host side: claim a colour slot for an incoming peer, or turn it away
    // once the room is full.
    function acceptPeer(conn) {
      if (!isHost) {
        conn.close();
        return;
      }

      if (connections.size + 1 > MAX_PLAYERS) {
        sendTo(conn, { type: 'roomFull', max: MAX_PLAYERS });
        setTimeout(() => conn.close(), 200);
        console.warn(`Room full (${MAX_PLAYERS}/${MAX_PLAYERS}), rejected ${conn.peer}`);
        return;
      }

      const slot = nextFreeSlot();
      connections.set(conn.peer, { conn, slot, stale: false });
      attachConnectionHandlers(conn, conn.peer, slot);

      sendTo(conn, {
        type: 'welcome',
        slot,
        players: buildRoster(),
        rectangles
      });
      broadcastRoster();
    }

    // Guest side: dial the host. Delivery stays reliable because level syncs
    // and death events cannot be dropped; player state is throttled instead.
    function connectToHost(hostId) {
      // A previous session to the same host may still be cached by PeerJS.
      const stale = peer.connections && peer.connections[hostId];
      if (stale) {
        try { stale.close(); } catch (e) {}
      }

      const conn = peer.connect(hostId, { reliable: true });
      connections.set(hostId, { conn, slot: 0, stale: false });
      attachConnectionHandlers(conn, hostId, 0);
      setMenuStatus('Connecting...');
    }

    function attachConnectionHandlers(conn, id) {
      conn.on('data', (data) => handlePeerData(id, data));
      conn.on('close', () => handlePeerClose(id));
      conn.on('error', (err) => console.warn('Connection error:', err && err.type));
    }

    function handlePeerData(connId, data) {
      if (!data || typeof data !== 'object') return;

      if (data.type === 'roomFull') {
        resetNetState();
        setMenuStatus(`World is full (${data.max || MAX_PLAYERS} players)`);
        showMainMenu();
        return;
      }

      if (isHost && data.from === localPeerId) return;

      switch (data.type) {
        case 'welcome':
          localSlot = data.slot;
          applyLocalColor();
          applyRoster(data.players);
          if (data.rectangles) adoptRemoteLevel(data.rectangles);
          sendPlayerState(true);
          if (!gameEntered) enterGame();
          break;
        case 'roster':
          applyRoster(data.players);
          break;
        case 'levelSync':
          applyLevelOps(data.upserts, data.removals);
          if (isHost) broadcast(data, connId);
          break;
        case 'playerState':
        case 'death':
          // Identity is the original sender, not the connection the packet
          // arrived on: everything the host relays reaches a guest over the
          // host's own connection, so keying by connId would collapse every
          // remote player into one entry that flickers between senders.
          applyRemoteMessage(data.from || connId, data);
          if (isHost) broadcast(data, connId);
          break;
      }
    }

    function applyRemoteMessage(playerId, data) {
      let rp = remotePlayers.get(playerId);
      if (!rp) {
        rp = {
          x: data.x, y: data.y, vx: data.vx, vy: data.vy,
          facing: data.facing, animPhase: data.animPhase,
          isGrounded: data.isGrounded, crouchFactor: data.crouchFactor,
          rotation: data.rotation || 0,
          isAlive: true, isEditor: false,
          cursorX: data.cursorX, cursorY: data.cursorY, dist: 0,
          slot: colorIndex(data.slot),
          color: getPlayerColor(data.slot),
          snap: [],
          leg1: { x: data.x, y: data.y },
          leg2: { x: data.x, y: data.y }
        };
        remotePlayers.set(playerId, rp);
      }

      // Colour follows the slot the host handed out, not the wire payload.
      rp.slot = colorIndex(data.slot !== undefined ? data.slot : rp.slot);
      rp.color = getPlayerColor(rp.slot);

      // A death packet is only an explosion trigger: it carries no motion state
      // at all. Buffering it blended undefined into vx/animPhase, which NaNs the
      // interpolated walk cycle and then, through the leg easing, the feet
      // themselves, and a canvas path with a NaN coordinate is dropped whole.
      // The playerState that follows carries the real state, alive or not.
      if (data.type === 'death') {
        createExplosion(data.x, data.y, rp.color);
        playCrashSound();
        return;
      }

      // Positions are buffered and interpolated at render time instead of
      // snapping to whatever arrived last, which is what made remote players
      // stutter at the snapshot rate.
      rp.snap.push({
        t: performance.now(),
        x: data.x, y: data.y, vx: data.vx, vy: data.vy,
        facing: data.facing, animPhase: data.animPhase,
        isGrounded: data.isGrounded, crouchFactor: data.crouchFactor,
        rotation: data.rotation || 0,
        isAlive: data.isAlive !== false, isEditor: !!data.isEditor,
        cursorX: data.cursorX, cursorY: data.cursorY, dist: data.dist || 0
      });
      if (rp.snap.length > REMOTE_BUFFER_LIMIT) rp.snap.shift();
    }

    // Interpolates along the shortest arc, so wrapping values like the walk
    // cycle phase do not spin the long way round.
    function lerpAngle(a, b, t) {
      let delta = (b - a) % (Math.PI * 2);
      if (delta > Math.PI) delta -= Math.PI * 2;
      if (delta < -Math.PI) delta += Math.PI * 2;
      return a + delta * t;
    }

    function applyRemoteSample(rp, a, b, t) {
      rp.x = a.x + (b.x - a.x) * t;
      rp.y = a.y + (b.y - a.y) * t;
      rp.vx = a.vx + (b.vx - a.vx) * t;
      rp.vy = a.vy + (b.vy - a.vy) * t;
      rp.animPhase = lerpAngle(a.animPhase, b.animPhase, t);
      rp.rotation = lerpAngle(a.rotation, b.rotation, t);
      rp.crouchFactor = a.crouchFactor + (b.crouchFactor - a.crouchFactor) * t;
      rp.isGrounded = t < 0.5 ? a.isGrounded : b.isGrounded;
    }

    // Moves a remote player to where it should be drawn: one interpolation
    // delay behind the newest snapshot, so there is always a pair of snapshots
    // to blend. Clamps to the buffer ends rather than extrapolating, which
    // would overshoot when a peer's packets are late.
    function sampleRemote(rp) {
      const buf = rp.snap;
      if (buf.length === 0) return;

      const newest = buf[buf.length - 1];
      // Discrete state should not sit back in the interpolation window.
      rp.isAlive = newest.isAlive;
      rp.isEditor = newest.isEditor;
      rp.dist = newest.dist;
      rp.cursorX = newest.cursorX;
      rp.cursorY = newest.cursorY;
      rp.facing = newest.facing;

      const renderTime = performance.now() - REMOTE_INTERP_DELAY;

      if (buf.length === 1 || renderTime <= buf[0].t) {
        applyRemoteSample(rp, buf[0], buf[0], 0);
        return;
      }
      if (renderTime >= newest.t) {
        applyRemoteSample(rp, newest, newest, 0);
        return;
      }

      for (let i = buf.length - 1; i > 0; i--) {
        const b = buf[i];
        const a = buf[i - 1];
        if (renderTime < a.t || renderTime > b.t) continue;
        const span = b.t - a.t;
        applyRemoteSample(rp, a, b, span > 0 ? (renderTime - a.t) / span : 0);
        return;
      }
    }

    function handlePeerClose(id) {
      const entry = connections.get(id);
      if (entry && entry.stale) {
        connections.delete(id);
        return;
      }

      connections.delete(id);
      remotePlayers.delete(id);

      if (isHost) {
        broadcastRoster();
      } else {
        resetNetState();
        setMenuStatus('Disconnected from host');
        showMainMenu();
      }
    }

    function resetNetState() {
      connections.forEach((entry) => {
        entry.stale = true;
        try { entry.conn.close(); } catch (e) {}
      });
      connections.clear();
      remotePlayers.clear();
      isHost = false;
      netRole = null;
      localSlot = 0;
      applyLocalColor();
      applyRoster([]);
    }

    function nextFreeSlot() {
      const used = new Set([0]);
      connections.forEach((entry) => used.add(entry.slot));
      for (let i = 1; i < MAX_PLAYERS; i++) {
        if (!used.has(i)) return i;
      }
      return -1;
    }

    function buildRoster() {
      const list = [{ id: localPeerId, slot: 0 }];
      connections.forEach((entry, id) => list.push({ id, slot: entry.slot }));
      return list;
    }

    function broadcastRoster() {
      const players = buildRoster();
      broadcast({ type: 'roster', players });
      applyRoster(players);
    }

    function applyRoster(players) {
      roster = Array.isArray(players) ? players : [];

      // Drop anyone the host no longer lists, otherwise their last known
      // position would stay on screen as a frozen ghost.
      const present = new Set(roster.map(entry => entry.id));
      for (const id of remotePlayers.keys()) {
        if (!present.has(id)) remotePlayers.delete(id);
      }

      for (const entry of roster) {
        const rp = remotePlayers.get(entry.id);
        if (rp) {
          rp.slot = entry.slot;
          rp.color = getPlayerColor(entry.slot);
        }
      }
    }

    function sendTo(conn, msg) {
      if (!conn || !conn.open) return;
      try {
        conn.send(msg);
      } catch (err) {
        console.warn('Failed to send:', err && err.message);
      }
    }

    function broadcast(msg, exceptId) {
      connections.forEach((entry, id) => {
        if (id === exceptId) return;
        sendTo(entry.conn, msg);
      });
    }

    document.getElementById('hostBtn').onclick = () => {
      if (isHost) {
        becomeHost();
        return;
      }
      resetNetState();
      netRole = 'host';
      pendingJoinId = null;
      if (peer && !peer.destroyed && peer.open) {
        becomeHost();
      } else {
        ensurePeer();
      }
    };

    const peerIdInput = document.getElementById('peerIdInput');

    function joinRoom() {
      const hostId = peerIdInput.value.trim();
      if (!hostId) {
        alert('Enter a host ID first');
        peerIdInput.focus();
        return;
      }
      resetNetState();
      netRole = 'guest';
      if (peer && !peer.destroyed && peer.open) {
        connectToHost(hostId);
      } else {
        pendingJoinId = hostId;
        ensurePeer();
      }
      peerIdInput.blur();
    }

    document.getElementById('joinBtn').onclick = joinRoom;

    peerIdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinRoom();
    });

    // Room codes are digits, so pasted text settles into something dialable.
    peerIdInput.addEventListener('input', () => {
      peerIdInput.value = peerIdInput.value.replace(/\D/g, '');
    });

    // --- Main menu wiring ---
    const mainMenu = document.getElementById('mainMenu');
    const menuHostBtn = document.getElementById('menuHostBtn');
    const menuJoinBtn = document.getElementById('menuJoinBtn');
    const menuPeerIdInput = document.getElementById('menuPeerIdInput');

    // Tracks whether we have crossed from the menu into the game proper. Stops
    // the welcome handler and the host's open handler from re-running enterGame
    // on reconnects, which would otherwise re-trigger a fresh restartGame.
    let gameEntered = false;

    function showMainMenu() {
      mainMenu.classList.remove('hidden');
      document.getElementById('ui').style.display = 'none';
      menuPeerIdInput.value = '';
      gameEntered = false;
    }

    function enterGame() {
      gameEntered = true;
      mainMenu.classList.add('hidden');
      document.getElementById('ui').style.display = 'flex';
      restartGame();
    }

    menuHostBtn.addEventListener('click', () => {
      initAudio();
      resetNetState();
      netRole = 'host';
      pendingJoinId = null;
      if (peer && !peer.destroyed && peer.open) {
        becomeHost();
      } else {
        ensurePeer();
      }
    });

    function menuJoin() {
      initAudio();
      const hostId = menuPeerIdInput.value.trim();
      if (!hostId) {
        menuPeerIdInput.focus();
        return;
      }
      resetNetState();
      netRole = 'guest';
      if (peer && !peer.destroyed && peer.open) {
        connectToHost(hostId);
      } else {
        pendingJoinId = hostId;
        ensurePeer();
      }
    }

    menuJoinBtn.addEventListener('click', menuJoin);
    menuPeerIdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') menuJoin();
    });
    menuPeerIdInput.addEventListener('input', () => {
      menuPeerIdInput.value = menuPeerIdInput.value.replace(/\D/g, '');
    });

    let lastStateSend = -Infinity;
    function sendPlayerState(force) {
      if (connections.size === 0) return;

      const now = performance.now();
      if (!force && now - lastStateSend < STATE_SEND_INTERVAL) return;
      lastStateSend = now;

      const mouseWorld = getCurrentMouseWorld();
      broadcast({
        type: 'playerState',
        from: localPeerId,
        slot: localSlot,
        x: player.x,
        y: player.y,
        vx: player.vx,
        vy: player.vy,
        facing: player.facing,
        animPhase: player.animPhase,
        isGrounded: player.isGrounded,
        crouchFactor: player.crouchFactor,
        rotation: player.rotation,
        isAlive: player.isAlive,
        isEditor: isEditor,
        dist: distanceMetres,
        cursorX: mouseWorld.x,
        cursorY: mouseWorld.y
      });
    }

    // What we believe every peer currently holds, keyed by rect id. The sync
    // diffs against this and sends only what actually changed. Shipping the whole
    // array instead meant two peers editing different shapes each sent a stale
    // copy of the other's shape every 50ms, so they kept overwriting each other
    // and a shape snapped back while you were still dragging it.
    let syncedRects = new Map();

    function isSameRectPayload(a, b) {
      return a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h &&
             a.type === b.type && (a.rotation || 0) === (b.rotation || 0) &&
             (a.spin || 0) === (b.spin || 0) && !!a.deadly === !!b.deadly;
    }

    function resetLevelSyncBaseline() {
      ensureRectIds(rectangles);
      syncedRects = new Map();
      for (const rect of rectangles) {
        syncedRects.set(rect.id, rectPayload(rect));
      }
    }

    // Shapes this client is actively dragging, resizing or rotating. A remote
    // update aimed at one of these is dropped: the in-flight gesture owns it
    // until the pointer comes back up, otherwise the shape is yanked out from
    // under the cursor by whichever peer happens to sync at that moment.
    function getLockedRectIds() {
      const locked = new Set();
      if (isDragging) {
        for (const rect of selectedRects) if (rect && rect.id) locked.add(rect.id);
      }
      if (resizeHandle && selectedRect && selectedRect.id) locked.add(selectedRect.id);
      if (isRotating && rotationStartRect && rotationStartRect.id) locked.add(rotationStartRect.id);
      return locked;
    }

    let levelSyncQueued = false;
    function sendLevelSync() {
      if (connections.size === 0 || levelSyncQueued) return;
      levelSyncQueued = true;
      // Editor edits fire on every pointer move while dragging, coalesce them.
      setTimeout(() => {
        levelSyncQueued = false;
        if (connections.size === 0) return;

        // Cheap insurance for any path that built a rect without going through
        // adoptLevel: the diff is keyed by id, so every rect needs one.
        ensureRectIds(rectangles);

        const upserts = [];
        const removals = [];
        const present = new Set();

        for (const rect of rectangles) {
          const payload = rectPayload(rect);
          const known = syncedRects.get(rect.id);
          if (!known || !isSameRectPayload(known, payload)) upserts.push(payload);
          syncedRects.set(rect.id, payload);
          present.add(rect.id);
        }

        for (const id of Array.from(syncedRects.keys())) {
          if (!present.has(id)) removals.push(id);
        }
        for (const id of removals) syncedRects.delete(id);

        if (upserts.length === 0 && removals.length === 0) return;

        broadcast({
          type: 'levelSync',
          from: localPeerId,
          upserts,
          removals
        });
      }, LEVEL_SYNC_INTERVAL);
    }

    // Applies a peer's edits in place, by id. Mutating the existing rect objects
    // rather than swapping in a fresh array keeps every live reference valid: the
    // selection, the rect being dragged and the rotation pivot all survive
    // another peer editing at the same time.
    function applyLevelOps(upserts, removals) {
      if (Array.isArray(removals)) {
        for (const id of removals) {
          const idx = rectangles.findIndex(r => r.id === id);
          if (idx !== -1) {
            const removed = rectangles[idx];
            selectedRects = selectedRects.filter(r => r !== removed);
            if (selectedRect === removed) selectedRect = null;
            if (shapePropsRect === removed) shapePropsRect = null;
            if (rotationStartRect === removed) rotationStartRect = null;
            if (playerGroundRect === removed) playerGroundRect = null;
            rectangles.splice(idx, 1);
          }
          syncedRects.delete(id);
        }
      }

      if (Array.isArray(upserts)) {
        const locked = getLockedRectIds();
        for (const payload of upserts) {
          if (!payload || !payload.id) continue;
          const existing = rectangles.find(r => r.id === payload.id);
          if (existing) {
            if (locked.has(payload.id)) continue;
            applyRectPayload(existing, payload);
            syncedRects.set(payload.id, rectPayload(existing));
          } else {
            const added = applyRectPayload({ id: payload.id }, payload);
            rectangles.push(added);
            syncedRects.set(payload.id, rectPayload(added));
          }
        }
      }
    }

    // Wholesale level adoption, used when a guest joins and the host hands over
    // the level. The selection is re-pointed by id; it used to be re-pointed by
    // indexOf() within the selection, which was then used as an index into the
    // whole level, so any sync moved the selection onto a different rect, or
    // emptied it entirely when the level had shrunk. An empty selection means the
    // mousedown handler skips its drag and resize branches, so nothing could be
    // moved or rotated at all.
    function adoptRemoteLevel(newRects) {
      rectangles = ensureRectIds(Array.isArray(newRects) ? newRects : []);

      const byId = new Map();
      for (const rect of rectangles) byId.set(rect.id, rect);

      selectedRects = selectedRects.map(r => byId.get(r.id)).filter(Boolean);
      if (rotationStartRect) rotationStartRect = byId.get(rotationStartRect.id) || null;
      if (shapePropsRect) shapePropsRect = byId.get(shapePropsRect.id) || null;
      selectedRect = selectedRects.length > 0 ? selectedRects[0] : null;

      resetLevelSyncBaseline();
    }

    // Replaces the level from local data (load, import, localStorage, undo). Keeps
    // ids so the sync diff still lines up with what peers already hold.
    function adoptLocalLevel(list) {
      rectangles = ensureRectIds(Array.isArray(list) ? list : []);
      // The whole array was just replaced, so anything held onto a rect from the
      // old one is stale. Selection is dropped rather than remapped: undo, load
      // and import have no meaningful counterpart for the old shapes.
      selectedRects = [];
      selectedRect = null;
      shapePropsRect = null;
      resetLevelSyncBaseline();
      return rectangles;
    }

    function sendDeathEvent(x, y) {
      if (connections.size === 0) return;
      broadcast({
        type: 'death',
        from: localPeerId,
        slot: localSlot,
        x: x,
        y: y
      });
    }

    let particles = [];
    let distanceMetres = 0;
    const keys = { left: false, right: false, jump: false, shift: false, crouch: false };

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      // setTransform, not scale: scale() multiplies whatever transform is
      // already there, so every resize would compound the last one and the
      // world would drift towards microscopic or gigantic.
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      groundY = Math.floor(((height / CAMERA_ZOOM) * 0.75) / GRID_SIZE) * GRID_SIZE;
    }
    window.addEventListener('resize', resize);
    resize();

    function getPolyDepth(nodeIdx) {
      const hash = Math.sin(nodeIdx * 12.9898 + 78.233) * 43758.5453;
      const pseudoRand = hash - Math.floor(hash);
      return 18 + Math.floor(pseudoRand * 4) * 8;
    }

    function getBladeProps(nodeIdx, edgeDist = 0) {
      const hash = Math.sin(nodeIdx * 39.346 + 11.233) * 23421.631;
      const r1 = hash - Math.floor(hash);
      const r2 = (hash * 10) - Math.floor(hash * 10);
      const r3 = (hash * 100) - Math.floor(hash * 100);
      
      let edgeFactor = 1.0;
      if (edgeDist < 48) {
        edgeFactor = 1.0 + (48 - edgeDist) / 48 * 0.5;
      }
      
      return {
        offX: (r1 - 0.5) * 6,
        width: (16 + r2 * 10) * edgeFactor,
        height: (32 + r3 * 24) * edgeFactor,
        lean: (r1 - 0.5) * 8
      };
    }

    // Depths (in rect local space, measured from the top surface downwards) that
    // are probed to find out whether a grass surface is buried under other grass.
    // Depths at or above the surface line catch a block resting on this one, so
    // its grass is hidden without the block having to overlap. The rest stay
    // inside the band the surface fill actually covers: probing deeper made a
    // grass platform standing on the ground read the ground as its cover, which
    // culled its whole grass layer.
    const GRASS_OCCLUSION_PROBES = [-6, 0, 8, 20, 44];

    function getGrassOcclusionProbes(rect) {
      const probes = [];
      for (let depth of GRASS_OCCLUSION_PROBES) {
        if (depth <= 0) {
          probes.push(depth);
          continue;
        }
        const clamped = Math.min(depth, rect.h - 1);
        if (clamped <= 0) break;
        if (probes.length > 0 && clamped <= probes[probes.length - 1]) break;
        probes.push(clamped);
      }
      return probes;
    }

    function isGrassEdgeOccluded(rect, localX) {
      const probes = getGrassOcclusionProbes(rect);

      for (let other of rectangles) {
        if (other === rect) continue;
        if (other.type !== 'grass') continue;
        for (let depth of probes) {
          const p = rectToWorld(rect, localX, depth);
          if (pointInRect(other, p.x, p.y)) return true;
        }
      }
      return false;
    }

    const GRASS_RUN_BISECT_STEPS = 6;

    // Bisects between a visible surface spot and an occluded one so ground
    // fills stop at the covering rect instead of at the node grid.
    function refineGrassRunEdge(rect, visibleLocalX, occludedLocalX) {
      let lo = visibleLocalX;
      let hi = occludedLocalX;
      for (let i = 0; i < GRASS_RUN_BISECT_STEPS; i++) {
        const mid = (lo + hi) / 2;
        if (isGrassEdgeOccluded(rect, mid)) hi = mid;
        else lo = mid;
      }
      return (lo + hi) / 2;
    }

    // Splits a rect's surface nodes into runs of contiguous, visible surface.
    function buildGrassRuns(rect, nodes) {
      const runs = [];
      let current = [nodes[0]];

      for (let i = 1; i < nodes.length; i++) {
        if (Math.abs(nodes[i].localX - current[current.length - 1].localX - NODE_SPACING) < 0.001) {
          current.push(nodes[i]);
        } else {
          runs.push(current);
          current = [nodes[i]];
        }
      }
      runs.push(current);

      return runs.map((run, runIndex) => {
        let startLocalX = run[0].localX;
        let endLocalX = run[run.length - 1].localX;

        if (runIndex === 0) {
          const prevLocalX = startLocalX - NODE_SPACING;
          startLocalX = (prevLocalX < 0 || !isGrassEdgeOccluded(rect, prevLocalX))
            ? 0
            : refineGrassRunEdge(rect, startLocalX, prevLocalX);
        }

        if (runIndex === runs.length - 1) {
          const nextLocalX = endLocalX + NODE_SPACING;
          endLocalX = (nextLocalX > rect.w || !isGrassEdgeOccluded(rect, nextLocalX))
            ? rect.w
            : refineGrassRunEdge(rect, endLocalX, nextLocalX);
        }

        return { startLocalX, endLocalX, nodes: run };
      });
    }

    function updateGrassSystem(activeCamX) {
      time += 0.03;
      const effectiveZoom = isEditor ? editorZoom : CAMERA_ZOOM;
      const viewWidth = width / effectiveZoom;
      const curCamX = activeCamX !== undefined ? activeCamX : cameraX;

      const leftBound = curCamX - 1000;
      const rightBound = curCamX + viewWidth + 1000;

      const GRASS_EDGE_PADDING = 4;

      grassBladesMap.clear();
      grassRunsByRect.clear();

      for (let rectIdx = 0; rectIdx < rectangles.length; rectIdx++) {
        const r = rectangles[rectIdx];
        if (r.type !== 'grass') continue;

        const rot = getRectRotation(r);
        const nodes = [];

        for (let localX = GRASS_EDGE_PADDING; localX <= r.w - GRASS_EDGE_PADDING; localX += NODE_SPACING) {
          const surface = rectToWorld(r, localX, 0);
          if (surface.x < leftBound || surface.x > rightBound) continue;
          if (isGrassEdgeOccluded(r, localX)) continue;

          const idx = Math.round(surface.x / NODE_SPACING);
          const depth = getPolyDepth(idx);
          nodes.push({ idx, localX, x: surface.x, y: surface.y, depth, rot });

          const edgeDist = Math.min(localX - GRASS_EDGE_PADDING, (r.w - GRASS_EDGE_PADDING) - localX);
          const props = getBladeProps(idx, edgeDist);
          const bladeLocalX = localX + props.offX;

          // Skip blades that would hang off the block instead of clipping them.
          const halfWidth = props.width / 2;
          if (bladeLocalX - halfWidth < 0 || bladeLocalX + halfWidth > r.w) continue;
          if (isGrassEdgeOccluded(r, bladeLocalX)) continue;

          const bladeSurface = rectToWorld(r, bladeLocalX, 0);
          grassBladesMap.set(`${rectIdx}_${idx}`, {
            idx,
            rect: r,
            localX: bladeLocalX,
            x: bladeSurface.x,
            y: bladeSurface.y,
            rotation: rot,
            width: props.width,
            height: props.height,
            lean: props.lean,
            deflection: 0
          });
        }

        if (nodes.length === 0) continue;
        grassRunsByRect.set(r, buildGrassRuns(r, nodes));
      }

      for (let blade of grassBladesMap.values()) {
        const dx = blade.x - player.x;
        const distY = Math.abs(player.y - blade.y);

        if (!isEditor && Math.abs(dx) < 50 && distY < 30) {
          const pushDir = dx > 0 ? 1 : -1;
          const pushForce = (1 - Math.abs(dx) / 50) * 25 * pushDir;

          if (Math.abs(player.vx) > 0.1) {
            blade.deflection += (player.vx * 4 - blade.deflection) * 0.35;
          } else {
            blade.deflection += (pushForce - blade.deflection) * 0.35;
          }
        }
        blade.deflection += (0 - blade.deflection) * 0.08;
      }
    }

    function drawTerrain(camX, camY = 0) {
      ctx.fillStyle = PALETTE.dirt;
      for (let r of rectangles) {
        if (r.type === 'grass') {
          ctx.save();
          setRectCanvasTransform(r, camX, camY);
          ctx.fillRect(0, 0, r.w, r.h);
          ctx.restore();
        }
      }

      ctx.fillStyle = PALETTE.ground;
      for (let r of rectangles) {
        if (r.type !== 'grass') continue;

        const runs = grassRunsByRect.get(r);
        if (!runs) continue;

        ctx.save();
        setRectCanvasTransform(r, camX, camY);

        for (const run of runs) {
          const runNodes = run.nodes;
          const firstDepth = runNodes[0].depth;
          const lastDepth = runNodes[runNodes.length - 1].depth;

          ctx.beginPath();
          ctx.moveTo(run.startLocalX, 0);
          ctx.lineTo(run.startLocalX, firstDepth);
          for (let n of runNodes) {
            ctx.lineTo(n.localX, n.depth);
          }
          ctx.lineTo(run.endLocalX, lastDepth);
          ctx.lineTo(run.endLocalX, 0);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }
    }

    function drawGrass(camX, camY = 0) {
      const windForce = Math.sin(time) * 4 + Math.cos(time * 0.6) * 2;
      ctx.fillStyle = PALETTE.ground;

      for (let blade of grassBladesMap.values()) {
        const halfWidth = blade.width / 2;
        const baseY = 1.5;
        const tipX = blade.lean + windForce + blade.deflection;
        const tipY = -blade.height;

        ctx.save();
        ctx.translate(blade.x - camX, (blade.y + baseY) - camY);
        if (blade.rotation !== 0) ctx.rotate(blade.rotation);

        ctx.beginPath();
        ctx.moveTo(-halfWidth, 0);
        ctx.quadraticCurveTo(-halfWidth * 0.5, -blade.height * 0.5, tipX, tipY);
        ctx.quadraticCurveTo(halfWidth * 0.5, -blade.height * 0.5, halfWidth, 0);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }

    function drawHexagon(cx, cy, radius) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i;
        const hx = cx + radius * Math.cos(angle);
        const hy = cy + radius * Math.sin(angle);
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      ctx.closePath();
      ctx.fill();
    }

    function solveIK(hipX, hipY, targetX, targetY, thighLen, shinLen, direction) {
      const dx = targetX - hipX;
      const dy = targetY - hipY;
      let dist = Math.sqrt(dx * dx + dy * dy);

      const maxDist = thighLen + shinLen - 0.01;
      const minDist = Math.abs(thighLen - shinLen) + 0.01;
      dist = Math.max(minDist, Math.min(maxDist, dist));

      const angleToTarget = Math.atan2(dx, dy);
      const cosAlpha = (thighLen * thighLen + dist * dist - shinLen * shinLen) / (2 * thighLen * dist);
      const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha)));

      const thighAngle = angleToTarget + direction * alpha;

      const kneeX = hipX + thighLen * Math.sin(thighAngle);
      const kneeY = hipY + thighLen * Math.cos(thighAngle);

      const shinAngle = Math.atan2(targetX - kneeX, targetY - kneeY);
      const tipX = kneeX + shinLen * Math.sin(shinAngle);
      const tipY = kneeY + shinLen * Math.cos(shinAngle);

      return { kneeX, kneeY, tipX, tipY };
    }

    // Eases a foot towards its target, snapping instead of easing whenever the
    // stored position cannot be trusted. Feet are tracked in screen space, and
    // both ways of getting that wrong are permanent: easing towards a NaN target
    // makes the stored value NaN for good, and a NaN reaching the leg path makes
    // the canvas drop the whole stroke, so the legs simply stop being drawn. A
    // remote player also starts out with its feet in world coordinates, far from
    // where the easing expects them, which would drag the legs across the screen.
    function stepLeg(leg, targetX, targetY, ease) {
      const usable = Number.isFinite(leg.x) && Number.isFinite(leg.y) &&
                     Number.isFinite(targetX) && Number.isFinite(targetY) &&
                     Math.abs(leg.x - targetX) < LEG_SNAP_DISTANCE &&
                     Math.abs(leg.y - targetY) < LEG_SNAP_DISTANCE;
      if (!usable) {
        leg.x = targetX;
        leg.y = targetY;
        return;
      }
      leg.x += (targetX - leg.x) * ease;
      leg.y += (targetY - leg.y) * ease;
    }

    // How far a foot may sit from its target before it is placed rather than
    // eased. Comfortably above a frame of running, well below a screen width.
    const LEG_SNAP_DISTANCE = 120;

    const PLAYER_HEAD_RADIUS = 15;
    const PLAYER_LEG_WIDTH = 12;
    const PLAYER_THIGH_LEN = 22;
    const PLAYER_SHIN_LEN = 22;
    const PLAYER_HEAD_GAP = 10;
    const PLAYER_STANDING_LEG_HEIGHT =
      2 * PLAYER_THIGH_LEN * Math.sin(((125 * Math.PI) / 180) / 2);
    const PLAYER_CROUCH_LEG_HEIGHT = PLAYER_STANDING_LEG_HEIGHT * 0.5;
    const TILT_PIVOT_TWEEN = 0.25;

    function getPlayerLegHeight(crouchFactor) {
      return PLAYER_STANDING_LEG_HEIGHT -
        crouchFactor * (PLAYER_STANDING_LEG_HEIGHT - PLAYER_CROUCH_LEG_HEIGHT);
    }

    // Eases the body onto the surface it is standing on. No position fixup is
    // needed: the renderer already spins about the feet, and player.x/y is the
    // foot contact point that collision, distance and the network rely on.
    function applyPlayerTilt(targetRotation) {
      player.rotation += (targetRotation - player.rotation) * TILT_PIVOT_TWEEN;
    }

    // posX/posY default to the simulated position; the local player passes the
    // interpolated one so drawing is not quantised to the 60Hz step.
    function drawPlayer(p, camX, camY = 0, posX = p.x, posY = p.y) {
      const screenX = posX - camX;
      
      const headRadius = PLAYER_HEAD_RADIUS;
      const legWidth = PLAYER_LEG_WIDTH;
      const thighLen = PLAYER_THIGH_LEN;
      const shinLen = PLAYER_SHIN_LEN;
      const headGap = PLAYER_HEAD_GAP;

      const currentLegHeight = getPlayerLegHeight(p.crouchFactor);
      
      const hipX = screenX;
      const hipY = (posY - currentLegHeight - legWidth / 2) - camY;

      const headX = hipX;
      const headY = hipY - headRadius - headGap;

      const dir = p.facing || 1;
      const groundContactY = (posY - legWidth / 2) - camY;

      const jumpKneeAngleRad = (170 * Math.PI) / 180;
      const jumpLegHeight = 2 * thighLen * Math.sin(jumpKneeAngleRad / 2);

      let target1X, target1Y, target2X, target2Y;

      if (p.isGrounded) {
        if (Math.abs(p.vx) > 0.05) {
          const stepLength = 32;
          const stride1 = -Math.cos(p.animPhase);
          const stride2 = -Math.cos(p.animPhase + Math.PI);

          const crouchStepFactor = 1 - p.crouchFactor * 0.5;
          const lift1 = Math.max(0, Math.sin(p.animPhase)) * 15 * crouchStepFactor;
          const lift2 = Math.max(0, Math.sin(p.animPhase + Math.PI)) * 15 * crouchStepFactor;

          target1X = hipX + stride1 * stepLength * crouchStepFactor * dir;
          target1Y = groundContactY - lift1;

          target2X = hipX + stride2 * stepLength * crouchStepFactor * dir;
          target2Y = groundContactY - lift2;
        } else {
          target1X = hipX;
          target1Y = groundContactY;
          target2X = hipX;
          target2Y = groundContactY;
        }
      } else {
        const isMovingHorizontally = (p === player ? (keys.left || keys.right) : false) || Math.abs(p.vx) > 0.1;
        const jumpProgress = Math.min(1, Math.max(0, 1 - Math.abs(p.vy) / 6));

        if (isMovingHorizontally) {
          const spread = 22 * dir;
          target1X = hipX + spread;
          target1Y = hipY + jumpLegHeight;
          target2X = hipX - spread;
          target2Y = hipY + jumpLegHeight;
        } else {
          const targetLegHeight = currentLegHeight + (jumpLegHeight - currentLegHeight) * (1 - jumpProgress * 0.5);
          target1X = hipX;
          target1Y = hipY + targetLegHeight;
          target2X = hipX;
          target2Y = hipY + targetLegHeight;
        }
      }

      // Same easing as before at 60Hz, just scaled to the real frame length so
      // the legs settle at the same visual rate on any display.
      const legEase = 1 - Math.pow(1 - 0.35, renderScale);
      stepLeg(p.leg1, target1X, target1Y, legEase);
      stepLeg(p.leg2, target2X, target2Y, legEase);

      ctx.save();
      // Your own runner stays solid so you can pick yourself out of a crowd.
      ctx.globalAlpha = p === player ? 0.75 : 0.45;

      // Spin about the contact point between the feet, not the middle of the
      // body, so a runner leaning on a slope pivots on their footing instead
      // of sinking through the surface. The leg IK targets above are in
      // unrotated screen space, so head and legs swing over as one piece.
      const pivotX = hipX;
      const pivotY = posY - camY;
      ctx.translate(pivotX, pivotY);
      ctx.rotate(p.rotation || 0);
      ctx.translate(-pivotX, -pivotY);

      const playerColor = p.color || PALETTE.player;
      ctx.fillStyle = playerColor;
      ctx.beginPath();
      ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
      ctx.fill();

      const ik1 = solveIK(hipX, hipY, p.leg1.x, p.leg1.y, thighLen, shinLen, dir);
      const ik2 = solveIK(hipX, hipY, p.leg2.x, p.leg2.y, thighLen, shinLen, dir);

      ctx.strokeStyle = playerColor;
      ctx.lineWidth = legWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(ik1.kneeX, ik1.kneeY);
      ctx.lineTo(ik1.tipX, ik1.tipY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(ik2.kneeX, ik2.kneeY);
      ctx.lineTo(ik2.tipX, ik2.tipY);
      ctx.stroke();

      ctx.restore();
    }

    function createExplosion(x, y, color = PALETTE.player) {
      for (let i = 0; i < 28; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          size: 4 + Math.random() * 8,
          alpha: 1,
          life: 0.02 + Math.random() * 0.03,
          color: color
        });
      }
    }

    function drawCursorAtScreenPos(sx, sy, isEditorMode, color = PALETTE.player, label = 'Peer') {
      ctx.save();
      ctx.fillStyle = color;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx, sy + 16);
      ctx.lineTo(sx + 4.5, sy + 12);
      ctx.lineTo(sx + 9, sy + 18);
      ctx.lineTo(sx + 12, sy + 16.5);
      ctx.lineTo(sx + 7.5, sy + 10.5);
      ctx.lineTo(sx + 12, sy + 10.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 4;
      ctx.fillText(isEditorMode ? `${label} (Editor)` : label, sx + 14, sy + 14);
      ctx.restore();
    }

    function drawRemotePlayer(rp, camX, camY = 0) {
      sampleRemote(rp);
      if (!rp.isAlive || rp.isEditor || rp.cursorX === undefined) return;
      drawPlayer(rp, camX, camY);
    }

    function drawRemoteCursor(rp, camX, camY = 0) {
      sampleRemote(rp);
      if (rp.cursorX === undefined) return;
      const sx = (rp.cursorX - camX) * CAMERA_ZOOM;
      const sy = (rp.cursorY - camY) * CAMERA_ZOOM;
      drawCursorAtScreenPos(sx, sy, rp.isEditor, rp.color, `Player ${rp.slot + 1}`);
    }

    function update() {
      // Animate explosion particles continuously for all clients
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy += 0.15;
        pt.alpha -= pt.life;
        if (pt.alpha <= 0) particles.splice(i, 1);
      }

      // Runs in the editor too, so spinning shapes preview as you set them up.
      // Held still during a rotation drag: the handle works off the live angle,
      // and a moving phase under the cursor makes it impossible to place.
      if (!isRotating) spinClock += FIXED_TIMESTEP / 1000;

      if (isEditor) {
        const activeCamX = editorCamX - (width / editorZoom) * 0.5;
        updateGrassSystem(activeCamX);
        sendPlayerState();
        return;
      }

      if (!player.isAlive) {
        sendPlayerState();
        return;
      }

      const targetCrouch = keys.crouch && player.isGrounded ? 1 : 0;
      player.crouchFactor += (targetCrouch - player.crouchFactor) * 0.2;
      player.isCrouching = player.crouchFactor > 0.5;

      const speedMultiplier = 1 - player.crouchFactor * 0.4;

      if (keys.left) {
        player.vx -= player.accel * speedMultiplier;
        if (player.vx < -player.maxSpeed * speedMultiplier) player.vx = -player.maxSpeed * speedMultiplier;
        player.facing = -1;
      } else if (keys.right) {
        player.vx += player.accel * speedMultiplier;
        if (player.vx > player.maxSpeed * speedMultiplier) player.vx = player.maxSpeed * speedMultiplier;
        player.facing = 1;
      } else {
        if (player.vx > 0) {
          player.vx = Math.max(0, player.vx - player.decel);
        } else if (player.vx < 0) {
          player.vx = Math.min(0, player.vx + player.decel);
        }
      }

      if (keys.jump && player.isGrounded && player.crouchFactor < 0.5) {
        player.vy = player.jumpForce;
        player.isGrounded = false;
        playJumpSound();
      }

      if (!keys.jump && player.vy < -1.8) {
        player.vy *= 0.82;
      }

      player.vy += player.gravity;

      const headRadius = 15;
      const totalHeight = 54 - player.crouchFactor * 27;

      player.x += player.vx;
      let box = getPlayerBox(player.x, player.y, totalHeight);

      for (let rect of rectangles) {
        if (isDeadly(rect)) {
          if (overlapsRectSpace(rect, box)) {
            player.isAlive = false;
            playCrashSound();
            const deathY = player.y - 20;
            createExplosion(player.x, deathY, player.color);
            sendDeathEvent(player.x, deathY);
            sendPlayerState();
            return;
          }
        } else {
          const local = getBoxInRectSpace(rect, box);
          const halfW = rect.w / 2;
          const halfH = rect.h / 2;
          const feetLocalY = worldToRect(rect, player.x, player.y).y - halfH;
          // The feet have to be beside the face rather than resting on the
          // surface, otherwise walking along a rotated surface would push the
          // player off it at the far end.
          if (feetLocalY > 2 && local.y - local.halfH < halfH - 2) {
            if (player.vx > 0 && local.x + local.halfW > -halfW && local.x - local.halfW < -halfW) {
              movePlayerToRectLocalX(rect, -halfW - headRadius);
              player.vx = 0;
            } else if (player.vx < 0 && local.x - local.halfW < halfW && local.x + local.halfW > halfW) {
              movePlayerToRectLocalX(rect, halfW + headRadius);
              player.vx = 0;
            }
          }
        }
      }

      const prevY = player.y;
      player.y += player.vy;
      box = getPlayerBox(player.x, player.y, totalHeight);
      let groundedThisFrame = false;
      let standRotation = 0; // surface tilt to lean into, 0 while airborne
      let standRect = null; // surface the feet were placed on
      const wasGrounded = player.isGrounded;

      for (let rect of rectangles) {
        if (isDeadly(rect)) {
          if (overlapsRectSpace(rect, box)) {
            player.isAlive = false;
            playCrashSound();
            const deathY = player.y - 20;
            createExplosion(player.x, deathY, player.color);
            sendDeathEvent(player.x, deathY);
            sendPlayerState();
            return;
          }
        } else {
          // Past the climb limit this face is a wall, not a floor: no landing on
          // it and no standing on it. Penetration resolution still keeps it solid,
          // so the runner is pushed off it rather than dropping through.
          if (!canStandOn(rect)) continue;

          const halfW = rect.w / 2;
          const feet = worldToRect(rect, player.x, player.y);
          const footLocalX = feet.x - halfW;
          const isOverEdge = footLocalX >= -halfW - headRadius && footLocalX <= halfW + headRadius;
          if (!isOverEdge) continue;

          if (player.vy >= 0 && feet.y >= -0.5 && worldToRect(rect, player.x, prevY).y <= 12) {
            player.y = getRectSurfaceY(rect, player.x);
            player.vy = 0;
            groundedThisFrame = true;
            standRotation = getRectRotation(rect);
            standRect = rect;
          } else if (wasGrounded && player.vy >= 0 && rect === playerGroundRect &&
                     feet.y >= -SLOPE_SNAP_DISTANCE) {
            // Walking down a slope: the surface has dropped away underneath, so
            // the feet sit a little above it. Falling onto it instead would leave
            // the runner airborne for a step or two on every stride and skitter
            // them down the hill, so hold them on the surface they are already
            // standing on, exactly as if it were flat.
            player.y = getRectSurfaceY(rect, player.x);
            player.vy = 0;
            groundedThisFrame = true;
            standRotation = getRectRotation(rect);
            standRect = rect;
          } else if (player.vy < 0) {
            const topLocal = worldToRect(rect, player.x, box.top);
            const topPrevLocal = worldToRect(rect, player.x, box.top - player.vy);
            if (topLocal.x >= -headRadius && topLocal.x <= rect.w + headRadius &&
                topLocal.y <= rect.h + 0.5 && topPrevLocal.y >= rect.h - 12) {
              const bumped = rectToWorld(rect, topLocal.x, rect.h);
              player.y = bumped.y + totalHeight + headRadius * 2;
              player.vy = 0;
            }
          }
        }
      }

      const landedRect = resolvePlayerPenetration(totalHeight);
      if (landedRect) {
        groundedThisFrame = true;
        standRotation = getRectRotation(landedRect);
        standRect = landedRect;
      }

      player.isGrounded = groundedThisFrame;
      playerGroundRect = standRect;
      applyPlayerTilt(standRotation);

      if (player.isGrounded && Math.abs(player.vx) > 0.1) {
        player.animPhase += Math.abs(player.vx) * 0.08;
      } else if (player.isGrounded) {
        player.animPhase = player.animPhase % (Math.PI * 2);
        if (player.animPhase > 0) {
          player.animPhase = Math.max(0, player.animPhase - 0.2);
        }
      }

      const viewHeight = height / CAMERA_ZOOM;
      if (player.y > viewHeight + 300) {
        player.isAlive = false;
        playCrashSound();
        const deathY = player.y - 50;
        createExplosion(player.x, deathY, player.color);
        sendDeathEvent(player.x, deathY);
      }

      const targetCamX = player.x - (width / CAMERA_ZOOM) * 0.5;
      const targetCamY = player.y - (height / CAMERA_ZOOM) * 0.55;
      cameraX += (targetCamX - cameraX) * 0.08;
      cameraY += (targetCamY - cameraY) * 0.04;

      updateGrassSystem(cameraX);
      distanceMetres = Math.floor(player.x / 100);
      sendPlayerState();
    }

    const PLATFORM_SHADOW_DEPTH = 400;

    function convexHullPoints(points) {
      const pts = points.slice().sort((a, b) => (a.x - b.x) || (a.y - b.y));
      const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);

      const build = (source) => {
        const stack = [];
        for (const p of source) {
          while (stack.length >= 2 && cross(stack[stack.length - 2], stack[stack.length - 1], p) <= 0) stack.pop();
          stack.push(p);
        }
        return stack;
      };

      const lower = build(pts);
      const upper = build(pts.slice().reverse());
      lower.pop();
      upper.pop();
      return lower.concat(upper);
    }

    // Shadow is the platform silhouette extruded straight down, so a rotated
    // platform keeps its shadow underneath instead of under its bounding box.
    function drawPlatformShadow(r, camX, camY) {
      /*const corners = getRectCorners(r);
      const hull = convexHullPoints(
        corners.concat(corners.map(c => ({ x: c.x, y: c.y + PLATFORM_SHADOW_DEPTH })))
      );

      ctx.beginPath();
      ctx.moveTo(hull[0].x - camX, hull[0].y - camY);
      for (let i = 1; i < hull.length; i++) {
        ctx.lineTo(hull[i].x - camX, hull[i].y - camY);
      }
      ctx.closePath();
      ctx.fill();*/
    }

    function rectToWorldUnspinned(rect, lx, ly) {
      const rot = rect.rotation || 0;
      if (rot === 0) return { x: rect.x + lx, y: rect.y + ly };
      const cx = rect.x + rect.w / 2;
      const cy = rect.y + rect.h / 2;
      const dx = lx - rect.w / 2;
      const dy = ly - rect.h / 2;
      const cos = Math.cos(rot);
      const sin = Math.sin(rot);
      return { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
    }

    function renderWorldObjects(camX, camY = 0, editorMode = false) {
      if (editorMode) {
        ctx.save();
        ctx.globalAlpha = 0.35;
        for (let r of rectangles) {
          if (r.spin) {
            ctx.save();
            setRectCanvasTransformUnspinned(r, camX, camY);
            if (r.type === 'grass') {
              ctx.fillStyle = PALETTE.dirt;
              ctx.fillRect(0, 0, r.w, r.h);
              ctx.fillStyle = PALETTE.ground;
              ctx.fillRect(0, 0, r.w, 24);
            } else if (r.type === 'platform') {
              ctx.fillStyle = PALETTE.platform;
              ctx.fillRect(0, 0, r.w, r.h);
            } else if (r.type === 'obstacle') {
              ctx.fillStyle = PALETTE.block;
              ctx.fillRect(0, 0, r.w, r.h);
            }
            ctx.restore();
          }
        }
        ctx.restore();
      }

      drawTerrain(camX, camY);
      drawGrass(camX, camY);

      ctx.fillStyle = PALETTE.platformShadow;
      for (let r of rectangles) {
        if (r.type === 'platform') {
          drawPlatformShadow(r, camX, camY);
        }
      }

      ctx.fillStyle = PALETTE.block;
      for (let r of rectangles) {
        if (r.type === 'obstacle') {
          ctx.save();
          setRectCanvasTransform(r, camX, camY);
          ctx.fillRect(0, 0, r.w, r.h);
          ctx.restore();
        }
      }

      for (let r of rectangles) {
        if (r.type === 'platform') {
          ctx.save();
          setRectCanvasTransform(r, camX, camY);
          ctx.fillStyle = PALETTE.platform;
          ctx.fillRect(0, 0, r.w, r.h);

          const boltInset = 7;
          const boltRadius = 3.5;
          ctx.fillStyle = PALETTE.bolt;
          if (r.w > boltInset * 2 && r.h > boltInset * 2) {
            drawHexagon(boltInset, boltInset, boltRadius);
            drawHexagon(r.w - boltInset, boltInset, boltRadius);
            drawHexagon(boltInset, r.h - boltInset, boltRadius);
            drawHexagon(r.w - boltInset, r.h - boltInset, boltRadius);
          }
          ctx.restore();
        }
      }

      if (!editorMode) {
        drawPlayer(player, camX, camY);
      }
    }

    function renderGame() {
      ctx.save();
      ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);

      renderWorldObjects(renderCameraX, renderCameraY);

      ctx.restore();

      remotePlayers.forEach((rp) => {
        // While playing, a cursor marks peers that are editing or already dead.
        sampleRemote(rp);
        if (rp.isEditor || !rp.isAlive) drawRemoteCursor(rp, renderCameraX, renderCameraY);
      });

      ctx.fillStyle = PALETTE.player;
      ctx.font = '400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`Quest 1.0`, 16, 36);

      ctx.textAlign = 'center';
      ctx.font = '700 64px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillText(`${distanceMetres} m`, width / 2, 64);

      if (!player.isAlive) {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = PALETTE.player;
        ctx.font = '700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Died!', width / 2, height / 2 - 20);

        ctx.font = '400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillText('Jump to restart...', width / 2, height / 2 + 20);
        ctx.restore();
      }
    }

    function worldToScreenEditor(wx, wy) {
      return {
        x: (wx - editorCamX) * editorZoom + width / 2,
        y: (wy - editorCamY) * editorZoom + height / 2
      };
    }

    function screenToWorldEditor(sx, sy) {
      return {
        x: (sx - width / 2) / editorZoom + editorCamX,
        y: (sy - height / 2) / editorZoom + editorCamY
      };
    }

    function getCurrentMouseWorld() {
      if (isEditor) {
        return screenToWorldEditor(lastMouseX, lastMouseY);
      } else {
        return {
          x: lastMouseX / CAMERA_ZOOM + renderCameraX,
          y: lastMouseY / CAMERA_ZOOM + renderCameraY
        };
      }
    }

    function drawGrid() {
      const startWorld = screenToWorldEditor(0, 0);
      const endWorld = screenToWorldEditor(width, height);

      const startX = Math.floor(startWorld.x / GRID_SIZE) * GRID_SIZE;
      const endX = Math.ceil(endWorld.x / GRID_SIZE) * GRID_SIZE;
      const startY = Math.floor(startWorld.y / GRID_SIZE) * GRID_SIZE;
      const endY = Math.ceil(endWorld.y / GRID_SIZE) * GRID_SIZE;

      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1;

      for (let x = startX; x <= endX; x += GRID_SIZE) {
        const screenX = (x - editorCamX) * editorZoom + width / 2;
        ctx.beginPath();
        ctx.moveTo(screenX, 0);
        ctx.lineTo(screenX, height);
        ctx.stroke();
      }

      for (let y = startY; y <= endY; y += GRID_SIZE) {
        const screenY = (y - editorCamY) * editorZoom + height / 2;
        ctx.beginPath();
        ctx.moveTo(0, screenY);
        ctx.lineTo(width, screenY);
        ctx.stroke();
      }

      ctx.restore();
    }

    function renderEditor() {
      drawGrid();

      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.scale(editorZoom, editorZoom);

      const activeCamX = editorCamX;
      const activeCamY = editorCamY;

      renderWorldObjects(activeCamX, activeCamY);

      for (let r of rectangles) {
        const isSelected = selectedRects.includes(r);

        ctx.save();
        setRectCanvasTransform(r, activeCamX, activeCamY);
        ctx.strokeStyle = isSelected ? '#ffffff' : 'rgba(0,0,0,0.3)';
        ctx.lineWidth = (isSelected ? 2 : 1) / editorZoom;
        ctx.strokeRect(0, 0, r.w, r.h);
        ctx.restore();
      }

      if (isSelecting) {
        const currentMouse = screenToWorldEditor(lastMouseX, lastMouseY);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1 / editorZoom;
        ctx.setLineDash([5 / editorZoom, 5 / editorZoom]);
        ctx.strokeRect(selectionStart.x - activeCamX, selectionStart.y - activeCamY,
                       currentMouse.x - selectionStart.x, currentMouse.y - selectionStart.y);
        ctx.setLineDash([]);
      }

      ctx.restore();

      ctx.save();
      ctx.fillStyle = '#ffffff';
      for (const rect of selectedRects) {
        for (let corner of getRectCorners(rect)) {
          const sp = worldToScreenEditor(corner.x, corner.y);
          ctx.fillRect(sp.x - 4, sp.y - 4, 8, 8);
        }
      }

      if (selectedRects.length === 1) {
        const rect = selectedRects[0];
        const anchor = rectToWorld(rect, rect.w / 2, 0);
        const anchorScreen = worldToScreenEditor(anchor.x, anchor.y);
        const handle = getRotationHandleScreenPos(rect);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(anchorScreen.x, anchorScreen.y);
        ctx.lineTo(handle.x, handle.y);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(handle.x, handle.y, 5, 0, Math.PI * 2);
        ctx.fill();

        if (isRotating) {
          const degrees = (getRectRotation(rect) * 180 / Math.PI).toFixed(1);
          ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.textAlign = 'center';
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.strokeText(`${degrees}°`, handle.x, handle.y - 12);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(`${degrees}°`, handle.x, handle.y - 12);
        }
      }
      ctx.restore();

      remotePlayers.forEach((rp) => {
        sampleRemote(rp);
        const sp = worldToScreenEditor(rp.cursorX, rp.cursorY);
        drawCursorAtScreenPos(sp.x, sp.y, rp.isEditor, rp.color, `Player ${rp.slot + 1}`);
      });
    }

    function render() {
      ctx.fillStyle = PALETTE.sky;
      ctx.fillRect(0, 0, width, height);

      if (isEditor) {
        renderEditor();
      } else {
        renderGame();
      }

      updateShapeProps();
    }

    // Physics runs on a fixed step so the tuned constants (and the collision
    // windows that depend on a known step size) behave identically on a 60Hz
    // laptop and a 144Hz monitor, instead of everything scaling with the
    // display's refresh rate.
    const FIXED_TIMESTEP = 1000 / 60;
    const MAX_FRAME_TIME = 250; // longer stalls are dropped, not simulated
    let accumulator = 0;
    let lastFrameTime = 0;
    let renderScale = 1; // frame length relative to one fixed step

    function gameLoop(now) {
      let frameTime;
      if (!lastFrameTime) {
        // First frame: step once so there is a world to draw.
        frameTime = FIXED_TIMESTEP;
      } else {
        // A backgrounded tab, a long GC pause or a breakpoint would otherwise
        // be simulated all in one go and fling the player through walls.
        frameTime = Math.min(now - lastFrameTime, MAX_FRAME_TIME);
      }
      lastFrameTime = now;
      renderScale = frameTime / FIXED_TIMESTEP;
      accumulator += frameTime;

      while (accumulator >= FIXED_TIMESTEP) {
        // Snapshot before stepping so the leftover accumulator can be used to
        // draw the frame somewhere between the last two simulated states.
        player.prevX = player.x;
        player.prevY = player.y;
        prevCameraX = cameraX;
        prevCameraY = cameraY;
        update();
        accumulator -= FIXED_TIMESTEP;
      }

      const alpha = accumulator / FIXED_TIMESTEP;
      player.renderX = player.prevX + (player.x - player.prevX) * alpha;
      player.renderY = player.prevY + (player.y - player.prevY) * alpha;
      renderCameraX = prevCameraX + (cameraX - prevCameraX) * alpha;
      renderCameraY = prevCameraY + (cameraY - prevCameraY) * alpha;

      render();
      requestAnimationFrame(gameLoop);
    }

    function restartGame() {
      player.x = 0;
      player.y = groundY;
      player.vx = 0;
      player.vy = 0;
      player.isGrounded = true;
      player.isAlive = true;
      player.facing = 1;
      player.animPhase = 0;
      player.isCrouching = false;
      player.crouchFactor = 0;
      player.rotation = 0;
      player.leg1 = { x: 0, y: groundY };
      player.leg2 = { x: 0, y: groundY };
      playerGroundRect = null;
      spinClock = 0;
      particles = [];
      grassBladesMap.clear();
      grassRunsByRect.clear();
      minNodeIdx = Infinity;
      maxNodeIdx = -Infinity;
      cameraX = player.x - (width / CAMERA_ZOOM) * 0.5;
      cameraY = player.y - (height / CAMERA_ZOOM) * 0.5;
      prevCameraX = cameraX;
      prevCameraY = cameraY;
      renderCameraX = cameraX;
      renderCameraY = cameraY;
      player.prevX = player.x;
      player.prevY = player.y;
      player.renderX = player.x;
      player.renderY = player.y;
      distanceMetres = 0;

      updateGrassSystem(cameraX);
    }

    let selectedRect = null;
    let selectedRects = [];
    let isDragging = false;
    let resizeHandle = null;
    let isPanning = false;
    let dragOffset = { x: 0, y: 0 };
    let panStart = { x: 0, y: 0 };
    let resizeInitial = { x: 0, y: 0, w: 0, h: 0, rotation: 0 };
    let resizeGrab = null;
    let clipboard = null;
    let isSelecting = false;
    let selectionStart = { x: 0, y: 0 };
    let lastMouseX = 0;
    let lastMouseY = 0;
    let undoStack = [];
    let redoStack = [];
    let dragStartPositions = [];
    let touchStartDist = 0;
    let touchStartZoom = 0;
    let isRotating = false;
    let rotationStartRect = null;
    let rotationStartAngle = 0;
    let rotationStartRotation = 0;

    const modeBtn = document.getElementById('modeBtn');
    const addBtn = document.getElementById('addBtn');
    const editorControls = document.getElementById('editorControls');
    const rectTypeSelect = document.getElementById('rectType');

    // Buttons and selects drop focus so the canvas keeps the keyboard, but the
    // host id field has to stay focusable or it can never be typed into. The spin
    // speed field is left focusable for the same reason, and only gives it up
    // once the value is committed.
    document.querySelectorAll('#ui button, #ui select, #shapeProps select, #shapeProps input[type="checkbox"]').forEach(el => {
      el.addEventListener('focus', () => el.blur());
    });

    function setPlacementMode(active) {
      isPlacementMode = active;
      if (isPlacementMode) {
        addBtn.classList.add('active');
        selectedRects = [];
        selectedRect = null;
        shapePropsRect = null;
      } else {
        addBtn.classList.remove('active');
      }
    }

    modeBtn.addEventListener('click', (e) => {
      e.target.blur();
      isEditor = !isEditor;
      isRotating = false;
      rotationStartRect = null;
      setPlacementMode(false);
      if (isEditor) {
        modeBtn.textContent = 'Switch to Play Mode';
        modeBtn.classList.add('active');
        editorControls.style.display = 'flex';
        editorCamX = player.x;
        editorCamY = groundY - (height / CAMERA_ZOOM) * 0.25;
        editorZoom = CAMERA_ZOOM;
        selectedRects = [];
        selectedRect = null;
        shapePropsRect = null;
      } else {
        modeBtn.textContent = 'Switch to Editor Mode';
        modeBtn.classList.remove('active');
        editorControls.style.display = 'none';
        restartGame();
      }
    });

    addBtn.addEventListener('click', (e) => {
