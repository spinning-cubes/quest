        ctx.font = '700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Died!', width / 2, height / 2 - 20);

        ctx.font = '400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillText('Jump to restart...', width / 2, height / 2 + 20);
        ctx.restore();
      }
    }

    function worldToScreenEditor(wx, wy) {
      return {
        x: (wx - editorCamX) * editorZoom + width / 2,
        y: (wy - editorCamY) * editorZoom + height / 2
      };
    }

    function screenToWorldEditor(sx, sy) {
      return {
        x: (sx - width / 2) / editorZoom + editorCamX,
        y: (sy - height / 2) / editorZoom + editorCamY
      };
    }

    function getCurrentMouseWorld() {
      if (isEditor) {
        return screenToWorldEditor(lastMouseX, lastMouseY);
      } else {
        return {
          x: lastMouseX / CAMERA_ZOOM + renderCameraX,
          y: lastMouseY / CAMERA_ZOOM + renderCameraY
        };
      }
    }

    function drawGrid() {
      const startWorld = screenToWorldEditor(0, 0);
      const endWorld = screenToWorldEditor(width, height);

      const startX = Math.floor(startWorld.x / GRID_SIZE) * GRID_SIZE;
      const endX = Math.ceil(endWorld.x / GRID_SIZE) * GRID_SIZE;
      const startY = Math.floor(startWorld.y / GRID_SIZE) * GRID_SIZE;
      const endY = Math.ceil(endWorld.y / GRID_SIZE) * GRID_SIZE;

      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1;

      for (let x = startX; x <= endX; x += GRID_SIZE) {
        const screenX = (x - editorCamX) * editorZoom + width / 2;
        ctx.beginPath();
        ctx.moveTo(screenX, 0);
        ctx.lineTo(screenX, height);
        ctx.stroke();
      }

      for (let y = startY; y <= endY; y += GRID_SIZE) {
        const screenY = (y - editorCamY) * editorZoom + height / 2;
        ctx.beginPath();
        ctx.moveTo(0, screenY);
        ctx.lineTo(width, screenY);
        ctx.stroke();
      }

      ctx.restore();
    }

    function renderEditor() {
      drawGrid();

      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.scale(editorZoom, editorZoom);

      const activeCamX = editorCamX;
      const activeCamY = editorCamY;

      renderWorldObjects(activeCamX, activeCamY);

      // Draw alive remote players in editor mode
      remotePlayers.forEach((rp) => {
        sampleRemote(rp);
        if (rp.isAlive && !rp.isEditor) {
          drawPlayer(rp, activeCamX, activeCamY, rp.x, rp.y);
        }
      });

      // Draw animation paths
      for (let r of rectangles) {
        if (r.hasPath && r.path && r.path.length >= 2) {
          const isEditingThisPath = isEditingPath && pathEditingRect === r;
          // Path points are relative to the shape's centre
          const center = getRectHomeCenter(r);
          const absolutePath = r.path.map(p => ({
            x: center.x + p.x,
            y: center.y + p.y
          }));
          drawPath(absolutePath, r.smoothPath, activeCamX, activeCamY, isEditingThisPath);
          if (showPathGhosts && !isEditingThisPath) {
            drawPathGhosts(r, activeCamX, activeCamY);
          }
        }
      }

      // Draw rectangle IDs for trigger linking
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.font = '10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'center';
      for (let r of rectangles) {
        if (r.id) {
          const center = getRectCenter(r);
          ctx.fillText(r.id, center.x - activeCamX, center.y - activeCamY);
        }
      }

      for (let r of rectangles) {
        const isSelected = selectedRects.includes(r);

        ctx.save();
        setRectCanvasTransform(r, activeCamX, activeCamY);
        ctx.strokeStyle = isSelected ? '#ffffff' : 'rgba(0,0,0,0.3)';
        ctx.lineWidth = (isSelected ? 2 : 1) / editorZoom;
        ctx.strokeRect(0, 0, r.w, r.h);
        ctx.restore();
      }

      if (isSelecting) {
        const currentMouse = screenToWorldEditor(lastMouseX, lastMouseY);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1 / editorZoom;
        ctx.setLineDash([5 / editorZoom, 5 / editorZoom]);
        ctx.strokeRect(selectionStart.x - activeCamX, selectionStart.y - activeCamY,
                       currentMouse.x - selectionStart.x, currentMouse.y - selectionStart.y);
        ctx.setLineDash([]);
      }

      ctx.restore();

      ctx.save();
      ctx.fillStyle = '#ffffff';
      for (const rect of selectedRects) {
        for (let corner of getRectCorners(rect)) {
          const sp = worldToScreenEditor(corner.x, corner.y);
          ctx.fillRect(sp.x - 4, sp.y - 4, 8, 8);
        }
      }

      if (selectedRects.length === 1) {
        const rect = selectedRects[0];
        const anchor = rectToWorld(rect, rect.w / 2, 0);
        const anchorScreen = worldToScreenEditor(anchor.x, anchor.y);
        const handle = getRotationHandleScreenPos(rect);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(anchorScreen.x, anchorScreen.y);
        ctx.lineTo(handle.x, handle.y);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(handle.x, handle.y, 5, 0, Math.PI * 2);
        ctx.fill();

        if (isRotating) {
          const degrees = (getRectRotation(rect) * 180 / Math.PI).toFixed(1);
          ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.textAlign = 'center';
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.strokeText(`${degrees}°`, handle.x, handle.y - 12);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(`${degrees}°`, handle.x, handle.y - 12);
        }
      }
      ctx.restore();

      remotePlayers.forEach((rp) => {
        sampleRemote(rp);
        const sp = worldToScreenEditor(rp.cursorX, rp.cursorY);
        drawCursorAtScreenPos(sp.x, sp.y, rp.isEditor, rp.color, `Player ${rp.slot + 1}`);
      });
    }

    function render() {
      ctx.fillStyle = PALETTE.sky;
      ctx.fillRect(0, 0, width, height);

      if (isEditor) {
        renderEditor();
      } else {
        renderGame();
      }

      updateShapeProps();
    }

    // Physics runs on a fixed step so the tuned constants (and the collision
    // windows that depend on a known step size) behave identically on a 60Hz
    // laptop and a 144Hz monitor, instead of everything scaling with the
    // display's refresh rate.
    const FIXED_TIMESTEP = 1000 / 60;
    const MAX_FRAME_TIME = 250; // longer stalls are dropped, not simulated
    let accumulator = 0;
    let lastFrameTime = 0;
    let renderScale = 1; // frame length relative to one fixed step

    function gameLoop(now) {
      let frameTime;
      if (!lastFrameTime) {
        // First frame: step once so there is a world to draw.
        frameTime = FIXED_TIMESTEP;
      } else {
        // A backgrounded tab, a long GC pause or a breakpoint would otherwise
        // be simulated all in one go and fling the player through walls.
        frameTime = Math.min(now - lastFrameTime, MAX_FRAME_TIME);
      }
      lastFrameTime = now;
      renderScale = frameTime / FIXED_TIMESTEP;
      accumulator += frameTime;

      while (accumulator >= FIXED_TIMESTEP) {
        // Snapshot before stepping so the leftover accumulator can be used to
        // draw the frame somewhere between the last two simulated states.
        player.prevX = player.x;
        player.prevY = player.y;
        prevCameraX = cameraX;
        prevCameraY = cameraY;
        update();
        accumulator -= FIXED_TIMESTEP;
      }

      const alpha = accumulator / FIXED_TIMESTEP;
      player.renderX = player.prevX + (player.x - player.prevX) * alpha;
      player.renderY = player.prevY + (player.y - player.prevY) * alpha;
      renderCameraX = prevCameraX + (cameraX - prevCameraX) * alpha;
      renderCameraY = prevCameraY + (cameraY - prevCameraY) * alpha;

      render();
      requestAnimationFrame(gameLoop);
    }

    function restartGame() {
      player.x = 0;
      player.y = groundY;
      player.vx = 0;
      player.vy = 0;
      player.isGrounded = true;
      player.isAlive = true;
      player.facing = 1;
      player.animPhase = 0;
      player.isCrouching = false;
      player.crouchFactor = 0;
      player.rotation = 0;
      player.leg1 = { x: 0, y: groundY };
      player.leg2 = { x: 0, y: groundY };
      playerGroundRect = null;
      spinClock = 0;
      particles = [];
      grassBladesMap.clear();
      grassRunsByRect.clear();
      minNodeIdx = Infinity;
      maxNodeIdx = -Infinity;
      cameraX = player.x - (width / CAMERA_ZOOM) * 0.5;
      cameraY = player.y - (height / CAMERA_ZOOM) * 0.5;
      prevCameraX = cameraX;
      prevCameraY = cameraY;
      renderCameraX = cameraX;
      renderCameraY = cameraY;
      player.prevX = player.x;
      player.prevY = player.y;
      player.renderX = player.x;
      player.renderY = player.y;
      distanceMetres = 0;

      // Reset path movement states
      pathMovementState.clear();
      // The host is what everyone else is measuring itself against, so it is
      // also the only one whose restart the room follows. A guest restarting on
      // its own death starts over locally and is pulled back onto the host's
      // phase by the next path report: one player dying cannot yank the level
      // out from under everyone still playing.
      for (const rect of rectangles) {
        if (rect.hasPath) {
          initPathMovement(rect);
        }
      }

      updateGrassSystem(cameraX);
    }

    let selectedRect = null;
    let selectedRects = [];
    let isDragging = false;
    let resizeHandle = null;
    let isPanning = false;
    let dragOffset = { x: 0, y: 0 };
    let panStart = { x: 0, y: 0 };
    let resizeInitial = { x: 0, y: 0, w: 0, h: 0, rotation: 0 };
    let resizeGrab = null;
    let clipboard = null;
    let isSelecting = false;
    let selectionStart = { x: 0, y: 0 };
    let lastMouseX = 0;
    let lastMouseY = 0;
    let undoStack = [];
    let redoStack = [];
    let dragStartPositions = [];
    let touchStartDist = 0;
    let touchStartZoom = 0;
    let isRotating = false;
    let rotationStartRect = null;
    let rotationStartAngle = 0;
    let rotationStartRotation = 0;

    const modeBtn = document.getElementById('modeBtn');
    const addBtn = document.getElementById('addBtn');
    const editorControls = document.getElementById('editorControls');
    const rectTypeSelect = document.getElementById('rectType');

    // Editor overlay showing the shape outlined at every point on its path.
    let showPathGhosts = true;

    // Buttons and selects drop focus so the canvas keeps the keyboard, but the
    // host id field has to stay focusable or it can never be typed into. The spin
    // speed field is left focusable for the same reason, and only gives it up
    // once the value is committed.
    document.querySelectorAll('#ui button, #ui select, #shapeProps select, #shapeProps input[type="checkbox"]').forEach(el => {
      el.addEventListener('focus', () => el.blur());
    });

    function setPlacementMode(active) {
      isPlacementMode = active;
      if (isPlacementMode) {
        addBtn.classList.add('active');
        selectedRects = [];
        selectedRect = null;
        shapePropsRect = null;
      } else {
        addBtn.classList.remove('active');
      }
    }

    modeBtn.addEventListener('click', (e) => {
      e.target.blur();

      // Handle path editing mode
      if (isEditingPath) {
        finishPathEditing();
        return;
      }

      isEditor = !isEditor;
      isRotating = false;
      rotationStartRect = null;
      setPlacementMode(false);
      if (isEditor) {
        modeBtn.textContent = 'Switch to Play Mode';
        modeBtn.classList.add('active');
        editorControls.style.display = 'flex';
        editorCamX = player.x;
        editorCamY = groundY - (height / CAMERA_ZOOM) * 0.25;
        editorZoom = CAMERA_ZOOM;
        selectedRects = [];
        selectedRect = null;
        shapePropsRect = null;
      } else {
        // Exit path editing if switching to play mode
        if (isEditingPath) {
          finishPathEditing();
        }
        modeBtn.textContent = 'Switch to Editor Mode';
        modeBtn.classList.remove('active');
        editorControls.style.display = 'none';
        restartGame();
      }
    });

    addBtn.addEventListener('click', (e) => {
      e.target.blur();
      setPlacementMode(!isPlacementMode);
    });

    document.getElementById('saveLocalBtn').addEventListener('click', (e) => {
      e.target.blur();
      localStorage.setItem('custom_runner_level', JSON.stringify(rectangles));
      alert('Level saved to LocalStorage!');
    });

    document.getElementById('loadLocalBtn').addEventListener('click', (e) => {
      e.target.blur();
      const data = localStorage.getItem('custom_runner_level');
      if (data) {
        adoptLocalLevel(JSON.parse(data));
        restartGame();
        sendLevelSync();
        alert('Level loaded from LocalStorage!');
      } else {
        alert('No saved level found in LocalStorage.');
      }
    });

    document.getElementById('exportBtn').addEventListener('click', (e) => {
      e.target.blur();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rectangles, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "level.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    document.getElementById('importBtn').addEventListener('click', (e) => {
      e.target.blur();
      document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          adoptLocalLevel(JSON.parse(event.target.result));
          sendLevelSync();
          alert('Level imported successfully!');
        } catch (err) {
          alert('Invalid JSON file.');
        }
      };
      reader.readAsText(file);
    });

    document.getElementById('clearBtn').addEventListener('click', (e) => {
      e.target.blur();
      if (confirm('Are you sure you want to clear all rectangles?')) {
        adoptLocalLevel(getDefaultRectangles());
        selectedRects = [];
        selectedRect = null;
        shapePropsRect = null;
        sendLevelSync();
      }
    });

    canvas.addEventListener('wheel', (e) => {
      if (!isEditor) return;
      e.preventDefault();
      
      if (e.ctrlKey || (Math.abs(e.deltaY) < 100 && Math.abs(e.deltaX) < 100)) {
        if (e.ctrlKey) {
          const zoomFactor = e.deltaY < 0 ? 1.05 : 0.95;
          editorZoom = Math.max(0.2, Math.min(4.0, editorZoom * zoomFactor));
        } else if ((e.buttons === 1 || e.buttons === 2) && (Math.abs(e.deltaX) > 10 || Math.abs(e.deltaY) > 10)) {
          editorCamX -= e.deltaX / editorZoom;
          editorCamY -= e.deltaY / editorZoom;
        }
      } else {
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        editorZoom = Math.max(0.2, Math.min(4.0, editorZoom * zoomFactor));
      }
    }, { passive: false });

    function getCornerHandle(e, rect) {
      if (!rect) return null;
      const hitRadius = 10;

      const localCorners = [
        { name: 'tl', lx: 0, ly: 0 },
        { name: 'tr', lx: rect.w, ly: 0 },
        { name: 'bl', lx: 0, ly: rect.h },
        { name: 'br', lx: rect.w, ly: rect.h }
      ];

      for (let c of localCorners) {
        const world = rectToWorld(rect, c.lx, c.ly);
        const sp = worldToScreenEditor(world.x, world.y);
        if (Math.hypot(e.clientX - sp.x, e.clientY - sp.y) <= hitRadius) {
          return c.name;
        }
      }
      return null;
    }

    function saveEditorState() {
      undoStack.push(JSON.stringify(rectangles));
      redoStack = [];
      if (undoStack.length > 50) undoStack.shift();
    }

    const ROTATION_SNAP = Math.PI / 12;
    const ROTATION_HANDLE_DISTANCE = 28;
    const ROTATION_HANDLE_HIT_RADIUS = 11;
    const DEG2RAD = Math.PI / 180;
    const MAX_SPIN_DEGREES = 720;

    // Free running time for spinning shapes, in seconds. Frozen while a shape is
    // being rotated by hand so the handle does not have to fight the animation.
    let spinClock = 0;

    // Path movement state for each rectangle
    const pathMovementState = new Map(); // rectId -> { phase, progress, direction, triggered, offsetX, offsetY, repeatCount, completed, remotePhase }

    // How much of the gap to the room's phase is closed per step. Low enough
    // that the correction is invisible as motion, high enough that a peer which
    // joined late is back in step inside a second.
    const PHASE_TRACK_RATE = 0.06;

    // Whether a shape kills the player on touch. Independent of `type`, which
    // only decides how the shape is drawn: shapes saved before this was
    // configurable carry no flag, and for those "obstacle" meant deadly.
    function isDeadly(rect) {
      return rect.deadly === undefined ? rect.type === 'obstacle' : !!rect.deadly;
    }

    // Spin is deliberately kept out of rect.rotation. That field stays the
    // authored base angle, so the rotation handle, the level sync and the saved
    // JSON all keep working on a static number while the shape still animates.
    function getSpinOffset(rect) {
      return rect.spin ? rect.spin * spinClock : 0;
    }

    function getRectRotation(rect) {
      return isEditor ? (rect.rotation || 0) : ((rect.rotation || 0) + getSpinOffset(rect));
    }

    // The live offset a path has pushed the shape to, applied at draw time only.
    // Same reasoning as spin above: rect.x/rect.y stays the authored home, so the
    // saved JSON, the level sync and the editor anchor all keep seeing a static
    // number instead of a position sampled mid-flight. Zero in the editor, where
    // nothing steps the path, so the shape sits on its home and can be grabbed.
    function getPathOffset(rect) {
      if (isEditor) return { x: 0, y: 0 };
      const state = pathMovementState.get(rect.id);
      if (!state) return { x: 0, y: 0 };
      return { x: state.offsetX || 0, y: state.offsetY || 0 };
    }

    // The centre is the point a path is authored and stored against, so the
    // middle of the shape travels the line you drew. Hanging the path off the
    // top left corner instead left every shape sitting up and to the left of
    // its own path by half its size. rect.x/rect.y stays the top left of the
    // authored home; the centre is derived from it.
    function getRectHomeCenter(rect) {
      return { x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 };
    }

    // Live centre: the home centre plus whatever the path has pushed the shape.
    function getRectCenter(rect) {
      const home = getRectHomeCenter(rect);
      const offset = getPathOffset(rect);
      return { x: home.x + offset.x, y: home.y + offset.y };
    }

    // Live top left corner, derived from the live centre.
    function getRectOrigin(rect) {
      const center = getRectCenter(rect);
      return { x: center.x - rect.w / 2, y: center.y - rect.h / 2 };
    }

    // --- Animation Path Functions ---

    function getPointOnPath(path, progress, smooth) {
      if (!path || path.length < 2) return null;

      const totalSegments = path.length - 1;
      const segmentProgress = progress * totalSegments;
      const segmentIndex = Math.floor(segmentProgress);
      const t = segmentProgress - segmentIndex;

      if (segmentIndex >= totalSegments) {
        return { x: path[path.length - 1].x, y: path[path.length - 1].y };
      }

      const p0 = path[segmentIndex];
      const p1 = path[segmentIndex + 1];

      if (smooth && segmentIndex > 0 && segmentIndex < totalSegments - 1) {
        const pPrev = path[segmentIndex - 1];
        const pNext = path[segmentIndex + 2];
        // Catmull-Rom spline interpolation
        const t2 = t * t;
        const t3 = t2 * t;

        const x = 0.5 * ((2 * p0.x) +
          (-pPrev.x + p1.x) * t +
          (2 * pPrev.x - 5 * p0.x + 4 * p1.x - pNext.x) * t2 +
          (-pPrev.x + 3 * p0.x - 3 * p1.x + pNext.x) * t3);
        const y = 0.5 * ((2 * p0.y) +
          (-pPrev.y + p1.y) * t +
          (2 * pPrev.y - 5 * p0.y + 4 * p1.y - pNext.y) * t2 +
          (-pPrev.y + 3 * p0.y - 3 * p1.y + pNext.y) * t3);

        return { x, y };
      }

      // Linear interpolation
      return {
        x: p0.x + (p1.x - p0.x) * t,
        y: p0.y + (p1.y - p0.y) * t
      };
    }

    function initPathMovement(rect) {
      // Cleared first: a shape that has just lost its path must not go on
      // drawing at whatever offset the old one left behind.
      pathMovementState.delete(rect.id);
      if (!rect.hasPath || !rect.path || rect.path.length < 2) return;

      const state = {
        phase: 0,
        progress: 0,
        direction: 1,
        triggered: false,
        offsetX: 0,
        offsetY: 0,
        repeatCount: 0,
        completed: false,
        remotePhase: null
      };
      pathMovementState.set(rect.id, state);
    }

    // Phase counts whole traversals of the path and only ever grows, which is
    // what lets a peer be steered towards the room's phase: progress itself
    // wraps at both ends, so nudging it directly would fling a shape back
    // across the path every time it bounced.
    function samplePathPhase(rect, phase) {
      if (rect.pathMode === 'bounce') {
        // Triangle fold: one traversal out, one back, forever.
        const u = phase - Math.floor(phase / 2) * 2;
        return u <= 1 ? { progress: u, direction: 1 } : { progress: 2 - u, direction: -1 };
      }
      return { progress: phase - Math.floor(phase), direction: 1 };
    }

    function updatePathMovement(rect, dt) {
      if (!rect.hasPath || !rect.path || rect.path.length < 2) return;

      let state = pathMovementState.get(rect.id);
      if (!state) {
        initPathMovement(rect);
        state = pathMovementState.get(rect.id);
        if (!state) return;
      }

      // Check if movement is completed
      if (state.completed) {
        state.offsetX = 0;
        state.offsetY = 0;
        return;
      }

      // Check if this is a triggerable path
      if (rect.pathMode === 'trigger' && !state.triggered) {
        // Stay home until something triggers it
        state.offsetX = 0;
        state.offsetY = 0;
        return;
      }

      // Calculate path length for speed normalization (using relative coordinates)
      let pathLength = 0;
      for (let i = 0; i < rect.path.length - 1; i++) {
        const dx = rect.path[i + 1].x - rect.path[i].x;
        const dy = rect.path[i + 1].y - rect.path[i].y;
        pathLength += Math.sqrt(dx * dx + dy * dy);
      }

      if (pathLength === 0) return;

      const speed = rect.pathSpeed || 100;
      const rate = speed / pathLength;
      state.phase += rate * dt;

      // Steer towards the phase the host last reported. The reference itself
      // lags by the network delay, so the error cannot be driven to zero, but it
      // is bled off a fraction at a time rather than snapped, which is what
      // keeps the motion smooth instead of stepping once per packet.
      //
      // A gap wider than a whole traversal is not network delay. It is a client
      // that joined late, was handed the level, or restarted on its own death:
      // drift of that size jumped outright, because closed gradually it looks
      // exactly like a shape crawling the wrong way along its path.
      if (state.remotePhase != null) {
        const err = state.remotePhase - state.phase;
        if (Math.abs(err) > 1) state.phase = state.remotePhase;
        else state.phase += err * PHASE_TRACK_RATE;
      }

      // A triggered path runs out at the far end and parks there.
      if (rect.pathMode === 'trigger' && state.phase >= 1) {
        state.phase = 1;
        state.triggered = false;
      }

      const sampled = samplePathPhase(rect, state.phase);
      state.progress = sampled.progress;
      state.direction = sampled.direction;
      state.repeatCount = Math.floor(state.phase);

      // Check repeat count
      const maxRepeats = rect.pathRepeats === 'number' ? (rect.pathRepeatCount || 1) : Infinity;
      if (state.repeatCount >= maxRepeats) {
        state.completed = true;
        state.phase = 0;
        state.offsetX = 0;
        state.offsetY = 0;
        return;
      }

      // Resolve the shape's centre on the path (relative to its home)
      const pos = getPointOnPath(rect.path, state.progress, rect.smoothPath);
      if (pos) {
        state.offsetX = pos.x;
        state.offsetY = pos.y;
      }
    }

    // Trigger paths are armed by a player touching a shape, so the arming is a
    // discrete event: broadcast it, or each client would start the shape one
    // network hop apart and they would stay out of step for good.
    // A trigger is a request, not an order: whoever touched the shape sends it
    // to the host, the host runs it, and the host's next path report carries the
    // result to everyone. Stamping it with a time would only work if the clocks
    // already agreed, which is the thing this design is not relying on.
    function triggerPath(rectId) {
      const state = pathMovementState.get(rectId);
      if (!state) return;

      state.triggered = true;
      state.completed = false;
      state.repeatCount = 0;
      state.phase = 0;
      // Let go of the host's last report. It describes where this path was
      // before it was triggered, and steering back towards it would undo the
      // trigger on the very frame it happened. The host's next report is what
      // takes over again.
      state.remotePhase = null;
      broadcastPathTrigger(rectId);
    }

    function broadcastPathTrigger(rectId) {
      if (connections.size === 0) return;
      broadcast({
        type: 'pathTrigger',
        from: localPeerId,
        slot: localSlot,
        id: rectId
      });
    }

    function applyRemotePathTrigger(rectId) {
      const rect = rectangles.find(r => r.id === rectId);
      if (!rect || !rect.hasPath) return;

      let state = pathMovementState.get(rectId);
      if (!state) {
        initPathMovement(rect);
        state = pathMovementState.get(rectId);
        if (!state) return;
      }

      state.triggered = true;
      state.completed = false;
      state.repeatCount = 0;
      state.phase = 0;
      // As above: the previous report is about a run that no longer exists.
      state.remotePhase = null;
    }

    // --- Path Editing Functions ---

    // A path is stored relative to its shape's centre, but the editor draws and
    // drags it in absolute world coords. Every edit has to be converted back
    // before it is mirrored onto the rect, otherwise the line renders a second
    // home-position away from where it was just drawn.
    function syncPathToEditor() {
      if (!pathEditingRect) return;
      const home = getRectHomeCenter(pathEditingRect);
      pathEditingRect.path = pathPoints.map(p => ({
        x: p.x - home.x,
        y: p.y - home.y
      }));
    }

    function startPathEditing(rect) {
      isEditingPath = true;
      pathEditingRect = rect;
      // Convert stored relative path points to absolute for editing
      const home = getRectHomeCenter(rect);
      pathPoints = rect.path ? rect.path.map(p => ({
        x: home.x + p.x,
        y: home.y + p.y
      })) : [];
      selectedPathPoint = null;
      draggedPathPoint = null;
      document.getElementById('modeBtn').textContent = 'Finish Path';
      document.getElementById('editorControls').style.display = 'none';

      // Mirror the path onto the rect so it renders immediately
      syncPathToEditor();
      rect.hasPath = true;
    }

    function finishPathEditing() {
      if (pathEditingRect) {
        syncPathToEditor();

        if (pathPoints.length < 2) {
          pathEditingRect.hasPath = false;
          pathEditingRect.path = [];
          pathMovementState.delete(pathEditingRect.id);
        } else {
          initPathMovement(pathEditingRect);
        }
        sendLevelSync();
      }
      isEditingPath = false;
      pathEditingRect = null;
      pathPoints = [];
      selectedPathPoint = null;
      draggedPathPoint = null;
      document.getElementById('modeBtn').textContent = 'Switch to Editor Mode';
      document.getElementById('editorControls').style.display = 'flex';
      updateShapeProps();
    }

    function addPathPoint(x, y) {
      // Check if close to first point to snap for closed loop
      const SNAP_DISTANCE = 20;
      if (pathPoints.length >= 2) {
        const firstPoint = pathPoints[0];
        const dx = x - firstPoint.x;
        const dy = y - firstPoint.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < SNAP_DISTANCE) {
          // Snap to first point to close the loop
          x = firstPoint.x;
          y = firstPoint.y;
        }
      }

      pathPoints.push({ x, y });
      // Update the rect path immediately so it renders during drawing
      syncPathToEditor();
    }

    function removePathPoint(index) {
      if (index >= 0 && index < pathPoints.length) {
        pathPoints.splice(index, 1);
        // Update the rect path immediately
        syncPathToEditor();
      }
    }

    function movePathPoint(index, x, y) {
      if (index >= 0 && index < pathPoints.length) {
        pathPoints[index].x = x;
        pathPoints[index].y = y;
        // Update the rect path immediately
        syncPathToEditor();
      }
    }

    function drawPath(path, smooth, camX, camY, isEditing = false) {
      if (!path || path.length < 1) return;

      ctx.save();
      ctx.strokeStyle = isEditing ? '#ff9800' : 'rgba(255, 152, 0, 0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);

      // Show snap indicator when editing and points are close
      let showSnapIndicator = false;
      if (isEditing && path.length >= 2) {
        const lastPoint = path[path.length - 1];
        const firstPoint = path[0];
        const dx = lastPoint.x - firstPoint.x;
        const dy = lastPoint.y - firstPoint.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < 20) {
          showSnapIndicator = true;
          ctx.strokeStyle = '#4caf50'; // Green when snapping
        }
      }

      if (path.length >= 2) {
        if (smooth && path.length >= 3) {
          // Draw smooth curve using Catmull-Rom spline
          ctx.beginPath();
          const startPos = { x: path[0].x - camX, y: path[0].y - camY };
          ctx.moveTo(startPos.x, startPos.y);

          for (let i = 0; i < path.length - 1; i++) {
            const p0 = path[Math.max(0, i - 1)];
            const p1 = path[i];
            const p2 = path[i + 1];
            const p3 = path[Math.min(path.length - 1, i + 2)];

            for (let t = 0; t <= 1; t += 0.1) {
              const t2 = t * t;
              const t3 = t2 * t;

              const x = 0.5 * ((2 * p1.x) +
                (-p0.x + p2.x) * t +
                (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
              const y = 0.5 * ((2 * p1.y) +
                (-p0.y + p2.y) * t +
                (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
                (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);

              ctx.lineTo(x - camX, y - camY);
            }
          }
          ctx.stroke();
        } else {
          // Draw straight lines
          ctx.beginPath();
          ctx.moveTo(path[0].x - camX, path[0].y - camY);
          for (let i = 1; i < path.length; i++) {
            ctx.lineTo(path[i].x - camX, path[i].y - camY);
          }
          ctx.stroke();
        }
      }

      ctx.setLineDash([]);

      // Draw control points when editing
      if (isEditing) {
        ctx.fillStyle = '#ff9800';
        for (let i = 0; i < path.length; i++) {
          const p = path[i];
          ctx.beginPath();
          ctx.arc(p.x - camX, p.y - camY, 6, 0, Math.PI * 2);
          ctx.fill();

          // Highlight selected point
          if (i === selectedPathPoint) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        }
      }

      ctx.restore();
    }

    // The four world corners of a shape sat at a given centre, at its authored
    // rotation. Same maths as rectToWorld, but with the centre passed in so a
    // ghost can be stamped anywhere along a path.
    function rectCornersAt(rect, cx, cy) {
      const rot = rect.rotation || 0;
      const cos = Math.cos(rot);
      const sin = Math.sin(rot);
      const corners = [];
      for (const [lx, ly] of [[0, 0], [rect.w, 0], [rect.w, rect.h], [0, rect.h]]) {
        const dx = lx - rect.w / 2;
        const dy = ly - rect.h / 2;
        corners.push({ x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos });
      }
      return corners;
    }

    // Outline of the shape at every point on its path, so the editor shows
    // where it will actually be rather than only the line it travels. Drawn at
    // the base rotation rather than the live one, matching the unspinned ghost
    // the editor already shows for spinning shapes.
    function drawPathGhosts(rect, camX, camY) {
      const home = getRectHomeCenter(rect);

      ctx.save();
      ctx.strokeStyle = 'rgba(255, 152, 0, 0.32)';
      ctx.lineWidth = 1 / editorZoom;
      for (const p of rect.path) {
        const corners = rectCornersAt(rect, home.x + p.x, home.y + p.y);
        ctx.beginPath();
        ctx.moveTo(corners[0].x - camX, corners[0].y - camY);
        for (let i = 1; i < corners.length; i++) {
          ctx.lineTo(corners[i].x - camX, corners[i].y - camY);
        }
        ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
    }

    function setRectRotation(rect, angle) {
      rect.rotation = Math.round((isEditor ? angle : (angle - getSpinOffset(rect))) * 1000) / 1000;
    }

    function getRotationHandleScreenPos(rect) {
      const up = getRectUp(rect);
      const anchor = rectToWorldUnspinned(rect, rect.w / 2, 0);
      const sp = worldToScreenEditor(anchor.x, anchor.y);
      return {
        x: sp.x + up.x * ROTATION_HANDLE_DISTANCE,
        y: sp.y + up.y * ROTATION_HANDLE_DISTANCE
      };
    }

    // Unit vector of the rect's local +x axis (its "right" side) in world space.
    function getRectRight(rect) {
      const rot = getRectRotation(rect);
      return { x: Math.cos(rot), y: Math.sin(rot) };
    }

    // Unit vector of the rect's local -y axis (its "top" side) in world space.
    function getRectUp(rect) {
      const rot = getRectRotation(rect);
      return { x: Math.sin(rot), y: -Math.cos(rot) };
    }

    // Converts a point in the rect's unrotated local space (origin at its top
    // left corner, ignoring rotation) to world space.
    function rectToWorld(rect, lx, ly) {
      const rot = getRectRotation(rect);
      const center = getRectCenter(rect);
      if (rot === 0) return { x: center.x + lx - rect.w / 2, y: center.y + ly - rect.h / 2 };
      const dx = lx - rect.w / 2;
      const dy = ly - rect.h / 2;
      const cos = Math.cos(rot);
      const sin = Math.sin(rot);
      return { x: center.x + dx * cos - dy * sin, y: center.y + dx * sin + dy * cos };
    }

    // Inverse of rectToWorld.
    function worldToRect(rect, wx, wy) {
      const rot = getRectRotation(rect);
      const center = getRectCenter(rect);
      if (rot === 0) return { x: wx - center.x + rect.w / 2, y: wy - center.y + rect.h / 2 };
      const dx = wx - center.x;
      const dy = wy - center.y;
      const cos = Math.cos(rot);
      const sin = Math.sin(rot);
      return { x: dx * cos + dy * sin + rect.w / 2, y: -dx * sin + dy * cos + rect.h / 2 };
    }

    function getRectCorners(rect) {
      return [
        rectToWorld(rect, 0, 0),
        rectToWorld(rect, rect.w, 0),
        rectToWorld(rect, rect.w, rect.h),
        rectToWorld(rect, 0, rect.h)
      ];
    }

    function pointInRect(rect, wx, wy) {
      const local = worldToRect(rect, wx, wy);
      return local.x >= 0 && local.x <= rect.w && local.y >= 0 && local.y <= rect.h;
    }

    // World y where the rect's top surface sits at the given world x.
    function getRectSurfaceY(rect, worldX) {
      const rot = getRectRotation(rect);
      if (rot === 0) return getRectOrigin(rect).y;
      const right = getRectRight(rect);
      const surface = rectToWorld(rect, rect.w / 2, 0);
      if (Math.abs(right.x) < 1e-6) return surface.y;
      const t = (worldX - surface.x) / right.x;
      return surface.y + t * right.y;
    }

    // Steepest surface a runner can hold onto. Past this the face is a wall: no
    // landing on it and no standing on it, so a slope that has been tipped too
    // far simply refuses to be climbed instead of turning into a floor.
    const MAX_CLIMB_ANGLE = (45 * Math.PI) / 180;

    function canStandOn(rect) {
      // Folded into (-PI, PI] first: the rotation handle can be dragged right
      // round, and 315 degrees is a climbable 45 degree slope, not a wall.
      let rot = getRectRotation(rect) % (Math.PI * 2);
      if (rot > Math.PI) rot -= Math.PI * 2;
      if (rot <= -Math.PI) rot += Math.PI * 2;
      return Math.abs(rot) <= MAX_CLIMB_ANGLE;
    }

    // How far the surface may fall away underfoot before the runner stops
    // following it. Running at full speed drops the surface by well under a
    // tenth of a unit per step, so this only has to swallow the rounding in the
    // surface height while staying far too small to yank the runner onto some
    // other block that happens to sit just below them.
    const SLOPE_SNAP_DISTANCE = 6;

    function isOnRotationHandle(e, rect) {
      const handle = getRotationHandleScreenPos(rect);
      return Math.hypot(e.clientX - handle.x, e.clientY - handle.y) <= ROTATION_HANDLE_HIT_RADIUS;
    }

    // Pointer angle around the rect's centre, measured on screen so it stays
    // consistent regardless of the editor zoom level.
    function getPointerAngleFromRectCenter(rect, clientX, clientY) {
      const center = getRectCenter(rect);
      const sp = worldToScreenEditor(center.x, center.y);
      return Math.atan2(clientY - sp.y, clientX - sp.x);
    }

    // Geometry the resize drag measures against, frozen at mousedown. The
    // inverse transform must never see the live w/h: a rotated rect's centre is
    // derived from its size, so writing the measured size straight back feeds it
    // into the next pointer move and the rect compounds until it fills the world.
    function getResizeBaseRect() {
      return {
        x: resizeInitial.x,
        y: resizeInitial.y,
        w: resizeInitial.w,
        h: resizeInitial.h,
        rotation: resizeInitial.rotation
      };
    }

    // Smallest edge a resize may leave behind. One grid cell, so a rect never
    // collapses to a hairline.
    const MIN_RECT_SIZE = GRID_SIZE;

    // Freezes the geometry a resize measures against and remembers where inside
    // the corner the drag actually started. The handle has a hit radius, so the
    // pointer is rarely dead on the corner; without this the rect teleports by up
    // to a handle radius on the very first move, which reads as a flicker.
    function beginResize(rect, corner, clientX, clientY) {
      saveEditorState();
      resizeHandle = corner;
      resizeInitial = { x: rect.x, y: rect.y, w: rect.w, h: rect.h, rotation: getRectRotation(rect) };
      const base = getResizeBaseRect();
      const world = screenToWorldEditor(clientX, clientY);
      const local = worldToRect(base, world.x, world.y);
      // Measured from the corner itself, not stored as the corner's own local
      // position, so the dragged edge stays pinned under the pointer.
      resizeGrab = {
        x: local.x - (corner.includes('l') ? 0 : base.w),
        y: local.y - (corner.includes('t') ? 0 : base.h)
      };
      selectedRect = rect;
    }

    // Applies one pointer position to a live resize drag. All of the measuring
    // happens in the rect's own local space (0,0 to w,h), the same frame
    // worldToRect hands back: mixing that local offset in with world positions is
    // what used to fling rects to the origin and grow them to fill the world.
    function applyResizeDrag(worldX, worldY, snap) {
      const rect = selectedRect;
      if (!rect || !resizeHandle) return;

      const base = getResizeBaseRect();
      const cursor = worldToRect(base, worldX, worldY);
      const grabX = resizeGrab ? resizeGrab.x : 0;
      const grabY = resizeGrab ? resizeGrab.y : 0;

      let left = 0;
      let right = base.w;
      let top = 0;
      let bottom = base.h;

      if (resizeHandle.includes('l')) left = cursor.x - grabX;
      if (resizeHandle.includes('r')) right = cursor.x - grabX;
      if (resizeHandle.includes('t')) top = cursor.y - grabY;
      if (resizeHandle.includes('b')) bottom = cursor.y - grabY;

      // Snap the dragged edges along the rect's own axes, so they land on grid
      // lines rather than being rounded twice and drifting off them.
      const rightAxis = getRectRight(base);
      const downAxis = { x: -rightAxis.y, y: rightAxis.x };
      const origin = rectToWorld(base, 0, 0);
      const originOnX = origin.x * rightAxis.x + origin.y * rightAxis.y;
      const originOnY = origin.x * downAxis.x + origin.y * downAxis.y;
      const snapOnAxis = (value, originOnAxis) =>
        Math.round((originOnAxis + value) / GRID_SIZE) * GRID_SIZE - originOnAxis;

      if (snap) {
        if (resizeHandle.includes('l')) left = snapOnAxis(left, originOnX);
        if (resizeHandle.includes('r')) right = snapOnAxis(right, originOnX);
        if (resizeHandle.includes('t')) top = snapOnAxis(top, originOnY);
        if (resizeHandle.includes('b')) bottom = snapOnAxis(bottom, originOnY);
      }

      // Clamp rather than discarding the update: dragging an edge past its
      // opposite side used to leave the rect frozen at its old size, so the drag
      // felt like it had stopped responding.
      if (right - left < MIN_RECT_SIZE) {
        if (resizeHandle.includes('l')) left = right - MIN_RECT_SIZE;
        else right = left + MIN_RECT_SIZE;
      }
      if (bottom - top < MIN_RECT_SIZE) {
        if (resizeHandle.includes('t')) top = bottom - MIN_RECT_SIZE;
        else bottom = top + MIN_RECT_SIZE;
      }

      const w = Math.round(right - left);
      const h = Math.round(bottom - top);

      // Where the new rect's local (0,0) corner has to sit for the dragged edge to
      // land on the cursor and the opposite edge to stay put: the base origin slid
      // by the local inset of the new top-left. The frame's axes and rotation are
      // untouched, so a rotated rect resizes along its own edges.
      const movedX = origin.x + left * rightAxis.x + top * downAxis.x;
      const movedY = origin.y + left * rightAxis.y + top * downAxis.y;

      // rect.x/rect.y are the centre-frame origin, which coincides with the
      // world position of the local (0,0) corner only while the rect is
      // unrotated, so solve for the centre and back out from there. Assigning
      // rect.x directly from the local inset instead would only be right for an
      // unrotated rect, and would drag a rotated one's corner off the cursor.
      const cos = Math.cos(base.rotation);
      const sin = Math.sin(base.rotation);
      const x = Math.round(movedX + (w / 2) * cos - (h / 2) * sin - w / 2);
      const y = Math.round(movedY + (w / 2) * sin + (h / 2) * cos - h / 2);

      if (rect.x === x && rect.y === y && rect.w === w && rect.h === h) return;
      rect.x = x;
      rect.y = y;
      rect.w = w;
      rect.h = h;
      sendLevelSync();
    }

    // Sets the canvas transform so the rect can be drawn in its own local
    // space (0,0 to w,h), with camera offset applied.
    function setRectCanvasTransform(rect, camX = 0, camY = 0) {
      const rot = getRectRotation(rect);
      const center = getRectCenter(rect);
      ctx.translate(center.x - camX, center.y - camY);
      if (rot !== 0) ctx.rotate(rot);
      ctx.translate(-rect.w / 2, -rect.h / 2);
    }

    // Projects an axis aligned box (the player's) into the rect's local axes,
    // so collision and grounding behave the same for rotated and flat rects.
    // The centre is relative to the rect's centre, the half sizes are the
    // box's bounding extents along the rect's axes.
    function getBoxInRectSpace(rect, box) {
      const right = getRectRight(rect);
      const down = { x: -right.y, y: right.x };
      const center = getRectCenter(rect);
      const boxCenterX = (box.left + box.right) / 2;
      const boxCenterY = (box.top + box.bottom) / 2;
      const halfW = (box.right - box.left) / 2;
      const halfH = (box.bottom - box.top) / 2;
      const dx = boxCenterX - center.x;
      const dy = boxCenterY - center.y;

      return {
        x: dx * right.x + dy * right.y,
        y: dx * down.x + dy * down.y,
        halfW: halfW * Math.abs(right.x) + halfH * Math.abs(right.y),
        halfH: halfW * Math.abs(down.x) + halfH * Math.abs(down.y)
      };
    }

    function overlapsRectSpace(rect, box) {
      const local = getBoxInRectSpace(rect, box);
      return local.x + local.halfW > -rect.w / 2 && local.x - local.halfW < rect.w / 2 &&
             local.y + local.halfH > -rect.h / 2 && local.y - local.halfH < rect.h / 2;
    }

    function getPlayerBox(px, py, totalHeight) {
      return {
        left: px - 15,
        right: px + 15,
        top: py - totalHeight - 15 * 2,
        bottom: py
      };
    }

    // Separating axis test between the player's upright box and a rect that may
    // be rotated. Returns the shallowest direction to push the player to get
    // them out (pointing away from the rect), or null when they don't overlap.
    function getBoxRectPushOut(rect, box) {
      const center = getRectCenter(rect);
      const right = getRectRight(rect);
      const down = { x: -right.y, y: right.x };
      const boxCenterX = (box.left + box.right) / 2;
      const boxCenterY = (box.top + box.bottom) / 2;
      const boxHalfW = (box.right - box.left) / 2;
      const boxHalfH = (box.bottom - box.top) / 2;

      const axes = [{ x: 1, y: 0 }, { x: 0, y: 1 }, right, down];
      let best = null;

      for (const axis of axes) {
        const boxRadius = boxHalfW * Math.abs(axis.x) + boxHalfH * Math.abs(axis.y);
        const rectRadius = (rect.w / 2) * Math.abs(right.x * axis.x + right.y * axis.y) +
                           (rect.h / 2) * Math.abs(down.x * axis.x + down.y * axis.y);
        const dist = (boxCenterX - center.x) * axis.x + (boxCenterY - center.y) * axis.y;
        const overlap = boxRadius + rectRadius - Math.abs(dist);
        if (overlap <= 0) return null;

        const sign = dist >= 0 ? 1 : -1;
        if (!best || overlap < best.depth) {
          best = { x: axis.x * sign, y: axis.y * sign, depth: overlap };
        }
      }

      return best;
    }

    // Safety net for the forgiving landing/side checks above: whatever the
    // orientation, the player must never stay inside a solid (a rotated rect's
    // underside has no landing case, so they would otherwise walk through it).
    // Resolves along the shallowest axis, like a rigid body solver would, and
    // drops the feet onto the surface when pushed out of a top face.
    // Returns the rect the feet ended up on, or null when nothing was landed on,
    // so the caller can lean the player into that surface. (An out-parameter
    // would not work: it is a primitive, so the caller's variable never changed
    // and the tilt was silently never applied.)
    function resolvePlayerPenetration(totalHeight) {
      let landedRect = null;

      for (let pass = 0; pass < 4; pass++) {
        let pushed = false;

        for (let rect of rectangles) {
          // Deadly shapes are handled by the touch check, so the solver never
          // has to reason about them. Everything else is solid and standable.
          if (isDeadly(rect)) continue;

          const box = getPlayerBox(player.x, player.y, totalHeight);
          const push = getBoxRectPushOut(rect, box);
          if (!push) continue;

          const up = getRectUp(rect);
          const isTopFace = push.x * up.x + push.y * up.y > 0.5;
          const feetLocalY = worldToRect(rect, player.x, player.y).y;

          // Standing on (or just into) the top face is the feet placement code's
          // job, and an upright box always pokes into a sloped surface.
          if (isTopFace && feetLocalY <= 15) continue;

          player.x += push.x * push.depth;
          player.y += push.y * push.depth;

          const intoSurface = player.vx * push.x + player.vy * push.y;
          if (intoSurface < 0) {
            player.vx -= push.x * intoSurface;
            player.vy -= push.y * intoSurface;
          }

          if (isTopFace) {
            player.y = getRectSurfaceY(rect, player.x);
            player.vy = 0;
            if (!landedRect) landedRect = rect;
          }

          pushed = true;
        }

        if (!pushed) break;
      }

      return landedRect;
    }

    // Slides the player sideways so their centre ends up at the given local x of
    // the rect, which is how walking into a rotated side face is resolved.
    function movePlayerToRectLocalX(rect, targetLocalX) {
      const right = getRectRight(rect);
      const center = getRectCenter(rect);
      const currentLocalX = (player.x - center.x) * right.x + (player.y - center.y) * right.y;
      const delta = targetLocalX - currentLocalX;
      player.x += delta * right.x;
      player.y += delta * right.y;
    }

    function undo() {
      if (undoStack.length === 0) return;
      redoStack.push(JSON.stringify(rectangles));
      adoptLocalLevel(JSON.parse(undoStack.pop()));
      selectedRects = [];
      selectedRect = null;
      sendLevelSync();
    }

    function redo() {
      if (redoStack.length === 0) return;
      undoStack.push(JSON.stringify(rectangles));
      adoptLocalLevel(JSON.parse(redoStack.pop()));
      selectedRects = [];
      selectedRect = null;
      sendLevelSync();
    }

    canvas.addEventListener('mousedown', (e) => {
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      if (!isEditor) return;
      const mouseWorld = screenToWorldEditor(e.clientX, e.clientY);

      // Handle path editing
      if (isEditingPath && pathEditingRect) {
        // Check if clicking on existing path point
        let clickedPointIndex = -1;
        for (let i = 0; i < pathPoints.length; i++) {
          const p = pathPoints[i];
          const dx = mouseWorld.x - p.x;
          const dy = mouseWorld.y - p.y;
          if (Math.sqrt(dx * dx + dy * dy) < 10) {
            clickedPointIndex = i;
            break;
          }
        }

        if (clickedPointIndex >= 0) {
          // Select existing point
          selectedPathPoint = clickedPointIndex;
          draggedPathPoint = clickedPointIndex;
        } else {
          // Add new point
          addPathPoint(mouseWorld.x, mouseWorld.y);
          selectedPathPoint = pathPoints.length - 1;
          draggedPathPoint = selectedPathPoint;
        }
        return;
      }

      if (e.button === 1) {
        isPanning = true;
        panStart = { x: e.clientX, y: e.clientY };
        return;
      }

      if (selectedRects.length === 1 && isOnRotationHandle(e, selectedRects[0])) {
        saveEditorState();
        selectedRect = selectedRects[0];
        isRotating = true;
        rotationStartRect = selectedRect;
        rotationStartRotation = getRectRotation(selectedRect);
        rotationStartAngle = getPointerAngleFromRectCenter(selectedRect, e.clientX, e.clientY);
        return;
      }

      if (selectedRects.length > 0) {
        for (const rect of selectedRects) {
          const corner = getCornerHandle(e, rect);
          if (corner) {
            beginResize(rect, corner, e.clientX, e.clientY);
            return;
          }
        }
        let clickedOnSelected = false;
        for (const rect of selectedRects) {
          if (pointInRect(rect, mouseWorld.x, mouseWorld.y)) {
            clickedOnSelected = true;
            break;
          }
        }
        if (clickedOnSelected) {
          isDragging = true;
          dragStartPositions = selectedRects.map(r => ({ x: r.x, y: r.y }));
          dragOffset = { x: mouseWorld.x - selectedRects[0].x, y: mouseWorld.y - selectedRects[0].y };
          return;
        }
      }

      if (e.shiftKey) {
        isSelecting = true;
        selectionStart = mouseWorld;
        return;
      }

      selectedRects = [];
      selectedRect = null;
      shapePropsRect = null;
      for (let i = rectangles.length - 1; i >= 0; i--) {
        const r = rectangles[i];
        if (pointInRect(r, mouseWorld.x, mouseWorld.y)) {
          selectedRect = r;
          selectedRects = [r];
          shapePropsRect = r;
          isDragging = true;
          dragOffset = { x: mouseWorld.x - r.x, y: mouseWorld.y - r.y };
          dragStartPositions = [{ x: r.x, y: r.y }];
          rectTypeSelect.value = r.type;
          setPlacementMode(false);
          break;
        }
      }

      if (!selectedRect && e.button === 0 && isPlacementMode) {
        saveEditorState();
        let spawnX = mouseWorld.x - 72;
        let spawnY = mouseWorld.y - 24;
        if (e.shiftKey) {
          spawnX = Math.round(spawnX / GRID_SIZE) * GRID_SIZE;
          spawnY = Math.round(spawnY / GRID_SIZE) * GRID_SIZE;
        }

        const newRect = {
          id: newRectId(),
          x: Math.round(spawnX),
          y: Math.round(spawnY),
          w: 144,
          h: 48,
          rotation: 0,
          spin: 0,
          type: rectTypeSelect.value,
          deadly: rectTypeSelect.value === 'obstacle'
        };
        rectangles.push(newRect);
        selectedRect = newRect;
        selectedRects = [newRect];
        shapePropsRect = newRect;
        isDragging = true;
        dragOffset = { x: mouseWorld.x - newRect.x, y: mouseWorld.y - newRect.y };
        setPlacementMode(false);
        sendLevelSync();
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      if (!isEditor) return;

      if (isPanning) {
        editorCamX -= (e.clientX - panStart.x) / editorZoom;
        editorCamY -= (e.clientY - panStart.y) / editorZoom;
        panStart = { x: e.clientX, y: e.clientY };
        return;
      }

      // Handle path point dragging
      if (isEditingPath && draggedPathPoint !== null) {
        const mouseWorld = screenToWorldEditor(e.clientX, e.clientY);
        movePathPoint(draggedPathPoint, mouseWorld.x, mouseWorld.y);
        return;
      }

      const mouseWorld = screenToWorldEditor(e.clientX, e.clientY);

      if (isSelecting) {
        return;
      }

      if (isRotating && rotationStartRect) {
        const rect = rotationStartRect;
        const angle = getPointerAngleFromRectCenter(rect, e.clientX, e.clientY);
        let nextRotation = rotationStartRotation + (angle - rotationStartAngle);
        nextRotation = e.shiftKey
          ? Math.round(nextRotation / ROTATION_SNAP) * ROTATION_SNAP
          : Math.round(nextRotation * 1000) / 1000;

        if (getRectRotation(rect) !== nextRotation) {
          setRectRotation(rect, nextRotation);
          sendLevelSync();
        }
        return;
      }

      if (resizeHandle && selectedRect) {
        // Corners are dragged in the rect's own space, so resizing a rotated
        // rect keeps its rotation.
        applyResizeDrag(mouseWorld.x, mouseWorld.y, e.shiftKey);
      } else if (isDragging && selectedRects.length > 0) {
        let newX = mouseWorld.x - dragOffset.x;
        let newY = mouseWorld.y - dragOffset.y;

        if (e.shiftKey) {
          newX = Math.round(newX / GRID_SIZE) * GRID_SIZE;
          newY = Math.round(newY / GRID_SIZE) * GRID_SIZE;
        }

        const deltaX = newX - dragStartPositions[0].x;
        const deltaY = newY - dragStartPositions[0].y;

        for (let i = 0; i < selectedRects.length; i++) {
          const rect = selectedRects[i];
          const startPos = dragStartPositions[i];
          rect.x = Math.round(startPos.x + deltaX);
          rect.y = Math.round(startPos.y + deltaY);
        }
        sendLevelSync();
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (isPanning) {
        isPanning = false;
        return;
      }

      // Handle path editing release
      if (isEditingPath) {
        draggedPathPoint = null;
        return;
      }

      if (isSelecting) {
        const mouseWorld = screenToWorldEditor(e.clientX, e.clientY);
        const minX = Math.min(selectionStart.x, mouseWorld.x);
        const maxX = Math.max(selectionStart.x, mouseWorld.x);
        const minY = Math.min(selectionStart.y, mouseWorld.y);
        const maxY = Math.max(selectionStart.y, mouseWorld.y);

        selectedRects = [];
        for (const r of rectangles) {
          if (r.x >= minX && r.x + r.w <= maxX && r.y >= minY && r.y + r.h <= maxY) {
            selectedRects.push(r);
          }
        }
        selectedRect = selectedRects.length > 0 ? selectedRects[0] : null;
        shapePropsRect = selectedRect;
        dragStartPositions = selectedRects.map(r => ({ x: r.x, y: r.y }));
        isSelecting = false;
      }

      if (isDragging) {
        saveEditorState();
        sendLevelSync();
      }

      if (isRotating) {
        sendLevelSync();
      }

      isDragging = false;
      isRotating = false;
      rotationStartRect = null;
      resizeHandle = null;
      resizeGrab = null;
      isPanning = false;
    });

    rectTypeSelect.addEventListener('change', (e) => {
      e.target.blur();
      if (selectedRects.length > 0) {
        for (const rect of selectedRects) {
          rect.type = rectTypeSelect.value;
          // The dropdown is a preset, so it also resets lethality to the new
          // type's default. Fine grained control lives in the settings window.
          rect.deadly = rectTypeSelect.value === 'obstacle';
        }
        sendLevelSync();
      }
    });

    // --- Floating settings window for the selected shape --------------------

    function setRectCanvasTransformUnspinned(rect, camX = 0, camY = 0) {
      const rot = rect.rotation || 0;
      ctx.translate(rect.x + rect.w / 2 - camX, rect.y + rect.h / 2 - camY);
      if (rot !== 0) ctx.rotate(rot);
      ctx.translate(-rect.w / 2, -rect.h / 2);
    }

    const shapeProps = document.getElementById('shapeProps');
    const spDeadly = document.getElementById('spDeadly');
    const spSpin = document.getElementById('spSpin');
    const spSpinSpeed = document.getElementById('spSpinSpeed');
    const spSpinDir = document.getElementById('spSpinDir');
    const spSpinOpts = shapeProps.querySelectorAll('.spSpinOpt');

    // Path property controls
    const spHasPath = document.getElementById('spHasPath');
    const spEditPathBtn = document.getElementById('spEditPathBtn');
    const spSmoothPath = document.getElementById('spSmoothPath');
    const spPathMode = document.getElementById('spPathMode');
    const spPathSpeed = document.getElementById('spPathSpeed');
    const spPathRepeats = document.getElementById('spPathRepeats');
    const spPathRepeatCount = document.getElementById('spPathRepeatCount');
    const spPathTrigger = document.getElementById('spPathTrigger');
    const spPathOpts = shapeProps.querySelectorAll('.spPathOpt');

    // The shape the window currently describes. Edits are applied to whatever is
    // selected instead, so a multi-selection can be reconfigured in one go, the
    // same way the type dropdown already behaves.
    let shapePropsRect = null;

    function getShapePropsTarget() {
      return shapePropsRect && selectedRects.includes(shapePropsRect) ? shapePropsRect : null;
    }

    function getSpinDegrees(rect) {
      return Math.round(Math.abs(rect.spin || 0) / DEG2RAD);
    }

    function readSpinSpeed() {
      if (spSpinSpeed.value.trim() === '') return null;
      const raw = Number(spSpinSpeed.value);
      if (!isFinite(raw)) return null;
      return Math.min(MAX_SPIN_DEGREES, Math.max(1, Math.round(raw)));
    }

    function updateShapePropsSpinRows() {
      const dimmed = !spSpin.checked;
      for (const row of spSpinOpts) row.classList.toggle('spDim', dimmed);
    }

    function applySpinToSelected(commit) {
      const target = getShapePropsTarget();
      if (!target) return;

      const degrees = readSpinSpeed();
      if (degrees === null) {
        // Half-typed nonsense: leave the shape alone until the value is
        // committed, rather than snapping it to some fallback mid-keystroke.
        if (commit) spSpinSpeed.value = getSpinDegrees(target) || 45;
        return;
      }
      if (commit) spSpinSpeed.value = degrees;

      // Stored signed, as radians a second, with the direction select supplying
      // the sign so the checkbox alone is enough to switch it off.
      const magnitude = degrees * DEG2RAD * Number(spSpinDir.value);
      for (const rect of selectedRects) {
        rect.spin = spSpin.checked ? magnitude : 0;
      }
      sendLevelSync();
    }

    spDeadly.addEventListener('change', () => {
      if (!getShapePropsTarget()) return;
      for (const rect of selectedRects) rect.deadly = spDeadly.checked;
      sendLevelSync();
    });

    spSpin.addEventListener('change', () => {
      if (spSpin.checked && readSpinSpeed() === null) spSpinSpeed.value = 45;
      updateShapePropsSpinRows();
      applySpinToSelected(true);
    });

    // Live while typing so the shape spins as the number changes. Focus is only
    // handed back on commit, since dropping it on every keystroke would make the
    // field impossible to type into.
    spSpinSpeed.addEventListener('input', () => applySpinToSelected(false));
    spSpinSpeed.addEventListener('change', (e) => {
      applySpinToSelected(true);
      e.target.blur();
    });

    spSpinDir.addEventListener('change', () => applySpinToSelected(true));

    // Path property event listeners
    spHasPath.addEventListener('change', () => {
      if (!getShapePropsTarget()) return;
      for (const rect of selectedRects) {
        rect.hasPath = spHasPath.checked;
        if (rect.hasPath && !rect.path) {
          rect.path = [];
        }
        if (rect.hasPath) {
          initPathMovement(rect);
        } else {
          pathMovementState.delete(rect.id);
        }
      }
      updateShapeProps();
      sendLevelSync();
    });

    spEditPathBtn.addEventListener('click', () => {
      if (!getShapePropsTarget()) return;
      const rect = selectedRects[0];
      if (rect.hasPath) {
        startPathEditing(rect);
      }
    });

    spSmoothPath.addEventListener('change', () => {
      if (!getShapePropsTarget()) return;
      for (const rect of selectedRects) rect.smoothPath = spSmoothPath.checked;
      sendLevelSync();
    });

    spPathMode.addEventListener('change', () => {
      if (!getShapePropsTarget()) return;
      for (const rect of selectedRects) rect.pathMode = spPathMode.value;
      updateShapeProps();
      sendLevelSync();
    });

    spPathSpeed.addEventListener('input', () => {
      if (!getShapePropsTarget()) return;
      const speed = Number(spPathSpeed.value);
      if (isFinite(speed)) {
        for (const rect of selectedRects) rect.pathSpeed = speed;
      }
    });

    spPathSpeed.addEventListener('change', (e) => {
      if (!getShapePropsTarget()) return;
      const speed = Number(spPathSpeed.value);
      if (isFinite(speed)) {
        for (const rect of selectedRects) rect.pathSpeed = speed;
      }
      e.target.blur();
      sendLevelSync();
    });

    spPathRepeats.addEventListener('change', () => {
      if (!getShapePropsTarget()) return;
      for (const rect of selectedRects) rect.pathRepeats = spPathRepeats.value;
      updateShapeProps();
      sendLevelSync();
    });

    spPathRepeatCount.addEventListener('input', () => {
      if (!getShapePropsTarget()) return;
      const count = Number(spPathRepeatCount.value);
      if (isFinite(count)) {
        for (const rect of selectedRects) rect.pathRepeatCount = count;
      }
    });

    spPathRepeatCount.addEventListener('change', (e) => {
      if (!getShapePropsTarget()) return;
      const count = Number(spPathRepeatCount.value);
      if (isFinite(count)) {
        for (const rect of selectedRects) rect.pathRepeatCount = count;
      }
      e.target.blur();
      sendLevelSync();
    });

    spPathTrigger.addEventListener('input', () => {
      if (!getShapePropsTarget()) return;
      for (const rect of selectedRects) rect.pathTrigger = spPathTrigger.value;
    });

    spPathTrigger.addEventListener('change', (e) => {
      if (!getShapePropsTarget()) return;
      for (const rect of selectedRects) rect.pathTrigger = spPathTrigger.value;
      e.target.blur();
      sendLevelSync();
    });

    function updateShapeProps() {
      if (!isEditor || selectedRects.length !== 1) {
        shapeProps.style.display = 'none';
        shapePropsRect = null;
        return;
      }

      const rect = selectedRects[0];
      shapePropsRect = rect;

      spDeadly.checked = isDeadly(rect);
      const isSpinning = !!rect.spin;
      spSpin.checked = isSpinning;

      document.querySelectorAll('#shapeProps .spSpinOpt').forEach(el => {
        el.style.display = isSpinning ? 'flex' : 'none';
      });

      if (isSpinning) {
        spSpinSpeed.value = Math.round(Math.abs(rect.spin) * (180 / Math.PI));
        spSpinDir.value = rect.spin >= 0 ? '1' : '-1';
      }

      // Path properties
      const hasPath = rect.hasPath || false;
      spHasPath.checked = hasPath;

      document.querySelectorAll('#shapeProps .spPathOpt').forEach(el => {
        el.classList.toggle('active', hasPath);
      });

      if (hasPath) {
        spSmoothPath.checked = rect.smoothPath || false;
        spPathMode.value = rect.pathMode || 'bounce';
        spPathSpeed.value = rect.pathSpeed || 100;
        spPathRepeats.value = rect.pathRepeats || 'forever';
        spPathRepeatCount.value = rect.pathRepeatCount || 1;
        spPathRepeatCount.style.display = spPathRepeats.value === 'number' ? 'inline' : 'none';
        spPathTrigger.value = rect.pathTrigger || '';
      }

      // Placement is pure CSS now, so there is no anchoring maths left here.
      shapeProps.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;

      initAudio();
      if (e.key === 'Tab' || e.code === 'Space' || e.key === ' ' || e.code.startsWith('Arrow')) {
        e.preventDefault();
      }

      if (e.key === 'Shift') keys.shift = true;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'ArrowDown' || e.code === 'KeyS') keys.crouch = true;

      if (isEditor) {
        // Overlay toggle. Handled before the path editing branch so it works
        // while a path is being drawn too.
        if (e.code === 'KeyG') {
          showPathGhosts = !showPathGhosts;
          e.preventDefault();
          return;
        }

        // Path editing shortcuts
        if (isEditingPath) {
          if (e.code === 'Escape') {
            finishPathEditing();
            e.preventDefault();
            return;
          }
          if ((e.code === 'Delete' || e.code === 'Backspace') && selectedPathPoint !== null) {
            removePathPoint(selectedPathPoint);
            selectedPathPoint = null;
            e.preventDefault();
            return;
          }
          if (e.code === 'Enter') {
            finishPathEditing();
            e.preventDefault();
            return;
          }
          return;
        }

        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
          undo();
          e.preventDefault();
        }
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyY') {
          redo();
          e.preventDefault();
        }
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyC' && selectedRects.length > 0) {
          clipboard = selectedRects.map(r => ({ ...r, id: undefined }));
          e.preventDefault();
        }
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyV' && clipboard) {
          saveEditorState();
          const pastedRects = clipboard.map(r => ({ ...r, id: newRectId() }));
          rectangles.push(...pastedRects);
          selectedRects = pastedRects;
          selectedRect = pastedRects[0];
          shapePropsRect = pastedRects[0];
          sendLevelSync();
          e.preventDefault();
        }
        if (e.code === 'KeyR' && selectedRects.length > 0) {
          saveEditorState();
          for (const rect of selectedRects) {
            const temp = rect.w;
            rect.w = rect.h;
            rect.h = temp;
          }
          sendLevelSync();
          e.preventDefault();
        }
        if ((e.code === 'Delete' || e.code === 'Backspace') && selectedRects.length > 0) {
          saveEditorState();
          rectangles = rectangles.filter(r => !selectedRects.includes(r));
          selectedRects = [];
          selectedRect = null;
          sendLevelSync();
          e.preventDefault();
        }
        return;
      }

      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') {
        keys.jump = true;
        if (!player.isAlive) restartGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;

      if (e.key === 'Shift') keys.shift = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'ArrowDown' || e.code === 'KeyS') keys.crouch = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') keys.jump = false;
    });

    window.addEventListener('touchstart', (e) => {
      initAudio();
      if (isEditor) return;
      if (!player.isAlive) {
        restartGame();
        return;
      }
      const touchX = e.touches[0].clientX;
      if (touchX < width * 0.3) {
        keys.left = true;
      } else if (touchX < width * 0.6) {
        keys.right = true;
      } else {
        keys.jump = true;
      }
    });

    window.addEventListener('touchend', () => {
      keys.left = false;
      keys.right = false;
      keys.jump = false;
    });

    canvas.addEventListener('touchstart', (e) => {
      if (!isEditor) return;
      e.preventDefault();
      
      if (e.touches.length === 2) {
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        touchStartZoom = editorZoom;
        isPanning = true;
        panStart = { 
          x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
          y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
        return;
      }
      
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        lastMouseX = touch.clientX;
        lastMouseY = touch.clientY;
        const mouseWorld = screenToWorldEditor(touch.clientX, touch.clientY);
        const touchPoint = { clientX: touch.clientX, clientY: touch.clientY };

        if (selectedRects.length === 1 && isOnRotationHandle(touchPoint, selectedRects[0])) {
          saveEditorState();
          selectedRect = selectedRects[0];
          isRotating = true;
          rotationStartRect = selectedRect;
          rotationStartRotation = getRectRotation(selectedRect);
          rotationStartAngle = getPointerAngleFromRectCenter(selectedRect, touch.clientX, touch.clientY);
          return;
        }

        if (selectedRects.length > 0) {
          for (const rect of selectedRects) {
            const corner = getCornerHandle(touchPoint, rect);
            if (corner) {
              beginResize(rect, corner, touch.clientX, touch.clientY);
              return;
            }
          }
          let clickedOnSelected = false;
          for (const rect of selectedRects) {
            if (pointInRect(rect, mouseWorld.x, mouseWorld.y)) {
              clickedOnSelected = true;
              break;
            }
          }
          if (clickedOnSelected) {
            isDragging = true;
            dragStartPositions = selectedRects.map(r => ({ x: r.x, y: r.y }));
            dragOffset = { x: mouseWorld.x - selectedRects[0].x, y: mouseWorld.y - selectedRects[0].y };
            return;
          }
        }

        selectedRects = [];
        selectedRect = null;
        shapePropsRect = null;
        for (let i = rectangles.length - 1; i >= 0; i--) {
          const r = rectangles[i];
          if (pointInRect(r, mouseWorld.x, mouseWorld.y)) {
            selectedRect = r;
            selectedRects = [r];
            shapePropsRect = r;
            isDragging = true;
            dragOffset = { x: mouseWorld.x - r.x, y: mouseWorld.y - r.y };
            dragStartPositions = [{ x: r.x, y: r.y }];
            rectTypeSelect.value = r.type;
            setPlacementMode(false);
            break;
          }
        }

        if (!selectedRect && isPlacementMode) {
          saveEditorState();
          let spawnX = mouseWorld.x - 72;
          let spawnY = mouseWorld.y - 24;
          spawnX = Math.round(spawnX / GRID_SIZE) * GRID_SIZE;
          spawnY = Math.round(spawnY / GRID_SIZE) * GRID_SIZE;

          const newRect = {
            id: newRectId(),
            x: Math.round(spawnX),
            y: Math.round(spawnY),
            w: 144,
            h: 48,
            rotation: 0,
            spin: 0,
            type: rectTypeSelect.value,
            deadly: rectTypeSelect.value === 'obstacle'
          };
          rectangles.push(newRect);
          selectedRect = newRect;
          selectedRects = [newRect];
          isDragging = true;
          dragOffset = { x: mouseWorld.x - newRect.x, y: mouseWorld.y - newRect.y };
          setPlacementMode(false);
          sendLevelSync();
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!isEditor) return;
      e.preventDefault();
      
      if (e.touches.length === 2) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const zoomFactor = currentDist / touchStartDist;
        editorZoom = Math.max(0.2, Math.min(4.0, touchStartZoom * zoomFactor));
        
        const currentPanX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const currentPanY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        editorCamX -= (currentPanX - panStart.x) / editorZoom;
        editorCamY -= (currentPanY - panStart.y) / editorZoom;
        panStart = { x: currentPanX, y: currentPanY };
        return;
      }
      
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        lastMouseX = touch.clientX;
        lastMouseY = touch.clientY;
        const mouseWorld = screenToWorldEditor(touch.clientX, touch.clientY);

        if (isRotating && rotationStartRect) {
          const rect = rotationStartRect;
          const angle = getPointerAngleFromRectCenter(rect, touch.clientX, touch.clientY);
          let nextRotation = rotationStartRotation + (angle - rotationStartAngle);
          nextRotation = Math.round(nextRotation * 1000) / 1000;

          if (getRectRotation(rect) !== nextRotation) {
            setRectRotation(rect, nextRotation);
            sendLevelSync();
          }
        } else if (resizeHandle && selectedRect) {
          applyResizeDrag(mouseWorld.x, mouseWorld.y, true);
        } else if (isDragging && selectedRects.length > 0) {
          let newX = mouseWorld.x - dragOffset.x;
          let newY = mouseWorld.y - dragOffset.y;

          newX = Math.round(newX / GRID_SIZE) * GRID_SIZE;
          newY = Math.round(newY / GRID_SIZE) * GRID_SIZE;

          const deltaX = newX - dragStartPositions[0].x;
          const deltaY = newY - dragStartPositions[0].y;

          for (let i = 0; i < selectedRects.length; i++) {
            const rect = selectedRects[i];
            const startPos = dragStartPositions[i];
            rect.x = Math.round(startPos.x + deltaX);
            rect.y = Math.round(startPos.y + deltaY);
          }
          sendLevelSync();
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (!isEditor) return;

      if (isDragging) {
        saveEditorState();
        sendLevelSync();
      }

      if (isRotating) {
        sendLevelSync();
      }

      isDragging = false;
      isRotating = false;
      rotationStartRect = null;
      resizeHandle = null;
      resizeGrab = null;
      isPanning = false;
    });

    window.onload = async function () {
      await loadDefaultLevel();
      showMainMenu();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
