        for (let i = 0; i < selectedRects.length; i++) {
          const rect = selectedRects[i];
          const startPos = dragStartPositions[i];
          rect.x = Math.round(startPos.x + deltaX);
          rect.y = Math.round(startPos.y + deltaY);
        }
        sendLevelSync();
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (isSelecting) {
        const mouseWorld = screenToWorldEditor(e.clientX, e.clientY);
        const minX = Math.min(selectionStart.x, mouseWorld.x);
        const maxX = Math.max(selectionStart.x, mouseWorld.x);
        const minY = Math.min(selectionStart.y, mouseWorld.y);
        const maxY = Math.max(selectionStart.y, mouseWorld.y);

        selectedRects = [];
        for (const r of rectangles) {
          if (r.x >= minX && r.x + r.w <= maxX && r.y >= minY && r.y + r.h <= maxY) {
            selectedRects.push(r);
          }
        }
        selectedRect = selectedRects.length > 0 ? selectedRects[0] : null;
        dragStartPositions = selectedRects.map(r => ({ x: r.x, y: r.y }));
        isSelecting = false;
      }

      if (isDragging) {
        saveEditorState();
        sendLevelSync();
      }

      if (isRotating) {
        sendLevelSync();
      }

      isDragging = false;
      isRotating = false;
      rotationStartRect = null;
      resizeHandle = null;
      isPanning = false;
    });

    rectTypeSelect.addEventListener('change', (e) => {
      e.target.blur();
      if (selectedRects.length > 0) {
        for (const rect of selectedRects) {
          rect.type = rectTypeSelect.value;
        }
        sendLevelSync();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;

      initAudio();
      if (e.key === 'Tab' || e.code === 'Space' || e.key === ' ' || e.code.startsWith('Arrow')) {
        e.preventDefault();
      }

      if (e.key === 'Shift') keys.shift = true;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'ArrowDown' || e.code === 'KeyS') keys.crouch = true;

      if (isEditor) {
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
          undo();
          e.preventDefault();
        }
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyY') {
          redo();
          e.preventDefault();
        }
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyC' && selectedRects.length > 0) {
          clipboard = selectedRects.map(r => ({ ...r }));
          e.preventDefault();
        }
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyV' && clipboard) {
          saveEditorState();
          const pastedRects = clipboard.map(r => ({ ...r }));
          rectangles.push(...pastedRects);
          selectedRects = pastedRects;
          selectedRect = pastedRects[0];
          sendLevelSync();
          e.preventDefault();
        }
        if (e.code === 'KeyR' && selectedRects.length > 0) {
          saveEditorState();
          for (const rect of selectedRects) {
            const temp = rect.w;
            rect.w = rect.h;
            rect.h = temp;
          }
          sendLevelSync();
          e.preventDefault();
        }
        if ((e.code === 'Delete' || e.code === 'Backspace') && selectedRects.length > 0) {
          saveEditorState();
          rectangles = rectangles.filter(r => !selectedRects.includes(r));
          selectedRects = [];
          selectedRect = null;
          sendLevelSync();
          e.preventDefault();
        }
        return;
      }

      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') {
        keys.jump = true;
        if (!player.isAlive) restartGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;

      if (e.key === 'Shift') keys.shift = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'ArrowDown' || e.code === 'KeyS') keys.crouch = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') keys.jump = false;
    });

    window.addEventListener('touchstart', (e) => {
      initAudio();
      if (isEditor) return;
      if (!player.isAlive) {
        restartGame();
        return;
      }
      const touchX = e.touches[0].clientX;
      if (touchX < width * 0.3) {
        keys.left = true;
      } else if (touchX < width * 0.6) {
        keys.right = true;
      } else {
        keys.jump = true;
      }
    });

    window.addEventListener('touchend', () => {
      keys.left = false;
      keys.right = false;
      keys.jump = false;
    });

    canvas.addEventListener('touchstart', (e) => {
      if (!isEditor) return;
      e.preventDefault();
      
      if (e.touches.length === 2) {
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        touchStartZoom = editorZoom;
        isPanning = true;
        panStart = { 
          x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
          y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
        return;
      }
      
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        lastMouseX = touch.clientX;
        lastMouseY = touch.clientY;
        const mouseWorld = screenToWorldEditor(touch.clientX, touch.clientY);
        const touchPoint = { clientX: touch.clientX, clientY: touch.clientY };

        if (selectedRects.length === 1 && isOnRotationHandle(touchPoint, selectedRects[0])) {
          saveEditorState();
          selectedRect = selectedRects[0];
          isRotating = true;
          rotationStartRect = selectedRect;
          rotationStartRotation = getRectRotation(selectedRect);
          rotationStartAngle = getPointerAngleFromRectCenter(selectedRect, touch.clientX, touch.clientY);
          return;
        }

        if (selectedRects.length > 0) {
          for (const rect of selectedRects) {
            const corner = getCornerHandle(touchPoint, rect);
            if (corner) {
              saveEditorState();
              resizeHandle = corner;
              resizeInitial = { x: rect.x, y: rect.y, w: rect.w, h: rect.h };
              selectedRect = rect;
              return;
            }
          }
          let clickedOnSelected = false;
          for (const rect of selectedRects) {
            if (pointInRect(rect, mouseWorld.x, mouseWorld.y)) {
              clickedOnSelected = true;
              break;
            }
          }
          if (clickedOnSelected) {
            isDragging = true;
            dragStartPositions = selectedRects.map(r => ({ x: r.x, y: r.y }));
            dragOffset = { x: mouseWorld.x - selectedRects[0].x, y: mouseWorld.y - selectedRects[0].y };
            return;
          }
        }

        selectedRects = [];
        selectedRect = null;
        for (let i = rectangles.length - 1; i >= 0; i--) {
          const r = rectangles[i];
          if (pointInRect(r, mouseWorld.x, mouseWorld.y)) {
            selectedRect = r;
            selectedRects = [r];
            isDragging = true;
            dragOffset = { x: mouseWorld.x - r.x, y: mouseWorld.y - r.y };
            dragStartPositions = [{ x: r.x, y: r.y }];
            rectTypeSelect.value = r.type;
            setPlacementMode(false);
            break;
          }
        }

        if (!selectedRect && isPlacementMode) {
          saveEditorState();
          let spawnX = mouseWorld.x - 72;
          let spawnY = mouseWorld.y - 24;
          spawnX = Math.round(spawnX / GRID_SIZE) * GRID_SIZE;
          spawnY = Math.round(spawnY / GRID_SIZE) * GRID_SIZE;

          const newRect = {
            x: Math.round(spawnX),
            y: Math.round(spawnY),
            w: 144,
            h: 48,
            rotation: 0,
            type: rectTypeSelect.value
          };
          rectangles.push(newRect);
          selectedRect = newRect;
          selectedRects = [newRect];
          isDragging = true;
          dragOffset = { x: mouseWorld.x - newRect.x, y: mouseWorld.y - newRect.y };
          setPlacementMode(false);
          sendLevelSync();
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!isEditor) return;
      e.preventDefault();
      
      if (e.touches.length === 2) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const zoomFactor = currentDist / touchStartDist;
        editorZoom = Math.max(0.2, Math.min(4.0, touchStartZoom * zoomFactor));
        
        const currentPanX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const currentPanY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        editorCamX -= (currentPanX - panStart.x) / editorZoom;
        editorCamY -= (currentPanY - panStart.y) / editorZoom;
        panStart = { x: currentPanX, y: currentPanY };
        return;
      }
      
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        lastMouseX = touch.clientX;
        lastMouseY = touch.clientY;
        const mouseWorld = screenToWorldEditor(touch.clientX, touch.clientY);

        if (isRotating && rotationStartRect) {
          const rect = rotationStartRect;
          const angle = getPointerAngleFromRectCenter(rect, touch.clientX, touch.clientY);
          let nextRotation = rotationStartRotation + (angle - rotationStartAngle);
          nextRotation = Math.round(nextRotation * 1000) / 1000;

          if (getRectRotation(rect) !== nextRotation) {
            rect.rotation = nextRotation;
            sendLevelSync();
          }
        } else if (resizeHandle && selectedRect) {
          const cursor = worldToRect(selectedRect, mouseWorld.x, mouseWorld.y);

          let left = resizeInitial.x;
          let right = resizeInitial.x + resizeInitial.w;
          let top = resizeInitial.y;
          let bottom = resizeInitial.y + resizeInitial.h;

          if (resizeHandle.includes('l')) left = cursor.x;
          if (resizeHandle.includes('r')) right = cursor.x;
          if (resizeHandle.includes('t')) top = cursor.y;
          if (resizeHandle.includes('b')) bottom = cursor.y;

          left = Math.round(left / GRID_SIZE) * GRID_SIZE;
          right = Math.round(right / GRID_SIZE) * GRID_SIZE;
          top = Math.round(top / GRID_SIZE) * GRID_SIZE;
          bottom = Math.round(bottom / GRID_SIZE) * GRID_SIZE;

          if (right - left >= GRID_SIZE) {
            selectedRect.x = left;
            selectedRect.w = right - left;
          }
          if (bottom - top >= GRID_SIZE) {
            selectedRect.y = top;
            selectedRect.h = bottom - top;
          }
          sendLevelSync();
        } else if (isDragging && selectedRects.length > 0) {
          let newX = mouseWorld.x - dragOffset.x;
          let newY = mouseWorld.y - dragOffset.y;

          newX = Math.round(newX / GRID_SIZE) * GRID_SIZE;
          newY = Math.round(newY / GRID_SIZE) * GRID_SIZE;

          const deltaX = newX - dragStartPositions[0].x;
          const deltaY = newY - dragStartPositions[0].y;

          for (let i = 0; i < selectedRects.length; i++) {
            const rect = selectedRects[i];
            const startPos = dragStartPositions[i];
            rect.x = Math.round(startPos.x + deltaX);
            rect.y = Math.round(startPos.y + deltaY);
          }
          sendLevelSync();
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (!isEditor) return;

      if (isDragging) {
        saveEditorState();
        sendLevelSync();
      }

      if (isRotating) {
        sendLevelSync();
      }

      isDragging = false;
      isRotating = false;
      rotationStartRect = null;
      resizeHandle = null;
      isPanning = false;
    });

    window.onload = async function () {
      await loadDefaultLevel();
      restartGame();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
