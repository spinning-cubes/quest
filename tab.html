            tab.querySelector('.tab-close').addEventListener('click', e => { e.stopPropagation(); closeTab(tabId); });
            activateTab(tabId);
            loadUrlViaWisp(iframe, url, tabId);
        }

        function activateTab(tabId) {
            tabsContainer.querySelectorAll('.tab').forEach(t => { if (t.dataset.id === tabId) { t.classList.remove('inactive'); t.classList.add('active'); } else { t.classList.remove('active'); t.classList.add('inactive'); } });
            viewport.querySelectorAll('iframe').forEach(f => { if (f.id === 'iframe-' + tabId) { f.classList.add('active'); searchBar.value = f.dataset.url || ''; } else f.classList.remove('active'); });
            activeTabId = tabId;
        }

        function closeTab(tabId) {
            const tab = tabsContainer.querySelector(`[data-id="${tabId}"]`);
            const iframe = document.getElementById('iframe-' + tabId);
            if (!tab) return;
            const wasActive = tab.classList.contains('active');
            const next = tab.nextElementSibling?.classList.contains('tab') ? tab.nextElementSibling : tab.previousElementSibling?.classList.contains('tab') ? tab.previousElementSibling : null;
            tab.remove(); if (iframe) iframe.remove();
            if (wasActive && next) activateTab(next.dataset.id);
            else if (!tabsContainer.querySelector('.tab')) { searchBar.value = ''; activeTabId = null; createTab(); }
        }

        function updateTabTitle(tabId, url) {
            const tab = tabsContainer.querySelector(`[data-id="${tabId}"]`);
            if (tab) { try { tab.querySelector('.label').textContent = new URL(url).hostname || url; } catch { tab.querySelector('.label').textContent = url; } }
        }

        addBtn.addEventListener('click', () => createTab('https://www.google.com/'));
        searchBar.addEventListener('keydown', e => { if (e.key === 'Enter' && activeTabId) { const f = document.getElementById('iframe-' + activeTabId); if (f) loadUrlViaWisp(f, searchBar.value, activeTabId); } });
        document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === ',') { e.preventDefault(); openSettings(); } if (e.key === 'Escape' && settingsModal.classList.contains('open')) closeSettings(); });

        initAndSetup();
        createTab('https://www.google.com/search?q=test');
    </script>
</body>
</html>
